name: Inspect unlinked Mirage premiere card

"on": push

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect film 7539 markers on Mirage homepage
        run: |
          set -euo pipefail
          curl --silent --show-error --location 'https://sml.mirage.ru/' -o /tmp/page.html
          echo "BYTES=$(wc -c </tmp/page.html)"
          grep -n -B 20 -A 30 '7539' /tmp/page.html | head -n 240 || true
          echo '--- poster marker ---'
          grep -o -E '.{0,160}s7539\.jpg.{0,220}' /tmp/page.html | head -n 20 || true
