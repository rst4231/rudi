name: Resolve Turbulence Mirage id

"on": push

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe nearby official Mirage film ids
        run: |
          set -euo pipefail
          for id in $(seq 7539 7565); do
            url="https://sml.mirage.ru/film/$id/"
            body="/tmp/$id.html"
            code=$(curl --silent --show-error --location --max-time 12 --output "$body" --write-out '%{http_code}' "$url" || true)
            title=$(grep -o -m1 -E '<h1[^>]*>[^<]+' "$body" 2>/dev/null | sed -E 's/<h1[^>]*>//' || true)
            if [ -z "$title" ]; then
              title=$(grep -o -m1 -E '<meta[^>]+(property|name)=["'"']og:title["'"'][^>]+content=["'"'][^"'"']+' "$body" 2>/dev/null | sed -E 's/.*content=["'"']([^"'"']+).*/\1/' || true)
            fi
            if [ -n "$title" ]; then
              echo "ID=$id HTTP=$code TITLE=$title"
              grep -o -m1 -E 'https://cdn\.mirage\.ru/images/film/[0-9]+/(big|small)/[sp][0-9]+\.jpg' "$body" || true
              grep -o -m1 -E 'с[[:space:]]+0?3[[:space:]]+Сентября' "$body" || true
            fi
          done
