name: Resolve Turbulence Mirage id

"on": push

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe nearby official Mirage film ids
        run: |
          node <<'NODE'
          const decode = (s) => String(s || '').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'");
          (async () => {
            for (let id = 7539; id <= 7565; id += 1) {
              const url = `https://sml.mirage.ru/film/${id}/`;
              try {
                const response = await fetch(url, { redirect: 'follow', headers: { 'user-agent': 'Mozilla/5.0' } });
                const html = await response.text();
                const h1 = html.match(/<h1\b[^>]*>([\s\S]*?)<\/h1>/i)?.[1]?.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                const og = html.match(/<meta[^>]+(?:property|name)=["']og:title["'][^>]+content=["']([^"']+)["']/i)?.[1]
                  || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']og:title["']/i)?.[1];
                const title = decode(h1 || og || '');
                if (!title) continue;
                const poster = html.match(/https:\/\/cdn\.mirage\.ru\/images\/film\/\d+\/(?:big|small)\/[sp]\d+\.jpg/i)?.[0] || null;
                const sept3 = /с\s+0?3\s+Сентября/i.test(html.replace(/<[^>]+>/g, ' '));
                console.log(JSON.stringify({ id, status: response.status, finalUrl: response.url, title, poster, sept3 }));
              } catch (error) {
                console.log(JSON.stringify({ id, error: String(error?.message || error) }));
              }
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
