name: Verify complete Mirage mirror

"on": push

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Parse sml Mirage mirror
        run: |
          node <<'NODE'
          const { loadMiragePremieres } = require('./api/cinema-premieres.cjs');
          (async () => {
            const rows = await loadMiragePremieres('2026-09-03', { name: 'Мираж Синема Санкт-Петербург', url: 'https://sml.mirage.ru/' }, {
              fetchImpl: globalThis.fetch,
              attempts: 2,
              timeoutMs: 15000,
            });
            console.log(JSON.stringify({ count: rows.length, titles: rows.map((x) => x.title), posterUrls: rows.map((x) => x.posterUrl), sourceUrls: rows.map((x) => x.sourceUrl) }, null, 2));
            if (rows.length < 7) process.exitCode = 2;
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
