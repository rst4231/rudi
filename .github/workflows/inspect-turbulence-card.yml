name: Publish complete corrected cinema 2026-09-03

"on": push

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify complete local source set
        run: |
          node <<'NODE'
          const { loadMiragePremieresWithFallback } = require('./api/cinema-premieres-collage.cjs');
          const config = require('./config/events.json');
          (async () => {
            const rows = await loadMiragePremieresWithFallback('2026-09-03', config.cinemaPremieres.mirage, {
              fetchImpl: globalThis.fetch,
              attempts: 2,
              timeoutMs: 15000,
            });
            console.log(JSON.stringify({ count: rows.length, titles: rows.map((x) => x.title) }, null, 2));
            if (rows.length < 7 || !rows.some((x) => x.title === 'Турбулентность')) {
              throw new Error(`incomplete-premiere-set-${rows.length}`);
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Verify remote config version
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch('https://raw.githubusercontent.com/rst4231/rudi/main/config/events.json', { cache: 'no-store' });
            const config = await response.json();
            console.log(JSON.stringify({ version: config.version, fallbackUrls: config.cinemaPremieres?.mirage?.fallbackUrls }, null, 2));
            if (Number(config.version) < 9 || !config.cinemaPremieres?.mirage?.fallbackUrls?.includes('https://sml.mirage.ru/film/7539/')) {
              throw new Error('remote-config-not-ready');
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Publish corrected cinema digest
        run: |
          set -euo pipefail
          curl --silent --show-error --location \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"action":"publish-section","section":"cinema","date":"2026-09-03","force":true}' \
            --output /tmp/result.json \
            --write-out '%{http_code}' \
            'https://spb-daily-guide-bot.vercel.app/api/admin' > /tmp/status.txt
          echo "HTTP $(cat /tmp/status.txt)"
          cat /tmp/result.json
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/result.json', 'utf8'));
          const native = body?.metadata?.nativeResult || body?.nativeResult || body?.result || body;
          const published = Number(native?.published ?? body?.published ?? 0);
          const messageId = native?.messageId ?? body?.messageId ?? null;
          const titles = native?.titles || body?.titles || [];
          console.log(JSON.stringify({ published, messageId, titles }, null, 2));
          if (published < 7 || !titles.includes('Турбулентность')) process.exit(2);
          NODE
