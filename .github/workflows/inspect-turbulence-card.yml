name: Verify canonical Turbulence fallback

"on": push

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify combined collector twice
        run: |
          node <<'NODE'
          const { loadMiragePremieresWithFallback } = require('./api/cinema-premieres-collage.cjs');
          const base = require('./config/events.json').cinemaPremieres.mirage;
          const config = {
            ...base,
            fallbackUrls: [
              'https://www.mirage.ru/film/7539/turbulentnost-.htm',
              ...base.fallbackUrls.filter((url) => !url.includes('/film/7539/')),
            ],
          };
          (async () => {
            for (let attempt = 1; attempt <= 2; attempt += 1) {
              const rows = await loadMiragePremieresWithFallback('2026-09-03', config, {
                fetchImpl: globalThis.fetch,
                attempts: 2,
                timeoutMs: 15000,
              });
              console.log(JSON.stringify({ attempt, count: rows.length, titles: rows.map((x) => x.title) }, null, 2));
              if (rows.length < 7 || !rows.some((x) => x.title === 'Турбулентность')) {
                throw new Error(`canonical-fallback-incomplete-${attempt}-${rows.length}`);
              }
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
