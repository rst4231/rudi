name: Diagnose Complete Mirage Sources

"on": push

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Check candidate official Mirage mirrors
        run: |
          node <<'NODE'
          const { loadMiragePremieres } = require('./api/cinema-premieres.cjs');
          const sources = [
            'https://msk.mirage.ru/',
            'https://sml.mirage.ru/',
            'https://utair.mirage.ru/',
            'https://atl.mirage.ru/',
            'https://ds1.mirage.ru/',
            'https://cloud.mirage.ru/'
          ];
          (async () => {
            for (const url of sources) {
              try {
                const rows = await loadMiragePremieres('2026-09-03', { name: 'Мираж Синема Санкт-Петербург', url }, { fetchImpl: globalThis.fetch, attempts: 2, timeoutMs: 15000 });
                console.log(JSON.stringify({url,count:rows.length,titles:rows.map(x=>x.title),sourceUrls:rows.map(x=>x.sourceUrl)}));
              } catch (error) {
                console.log(JSON.stringify({url,error:String(error?.message||error)}));
              }
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
