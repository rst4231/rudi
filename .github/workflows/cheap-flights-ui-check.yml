name: Cheap Flights UI Check

on:
  pull_request:
    paths:
      - 'api/cheap-flights.cjs'
      - 'api/feed-notify-cron.js'
      - 'api/partner-message.js'
      - 'public/**'
      - 'rudi-config.json'
      - 'rudi-version.json'
      - 'tests/cheap-flights.test.cjs'
      - 'vercel.json'
      - '.github/workflows/cheap-flights-ui-check.yml'

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --test tests/cheap-flights.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build
      - run: node -e "JSON.parse(require('fs').readFileSync('rudi-config.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8'));"
