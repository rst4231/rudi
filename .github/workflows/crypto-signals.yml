name: RUDI Crypto Signal Monitor

on:
  # Manual fallback only. The reliable Lulu schedule runs both scanners every 15m.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rudi-crypto-signal-monitor
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public ne_investor channel and refresh virtual positions
        shell: bash
        env:
          OIDC_AUDIENCE: rudi-crypto-signals
          RUDI_ENDPOINT: https://spb-daily-guide-bot.vercel.app/api/crypto-signals-cron
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          TOKEN="$(printf '%s' "${OIDC_RESPONSE}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          # Each scanner is independent: a public Telegram outage must not
          # prevent monitoring our separate paper-trading strategies.
          curl -fsS --retry 1 --retry-all-errors --retry-delay 3 --max-time 95 \
            -H "Authorization: Bearer ${TOKEN}" \
            "${RUDI_ENDPOINT}" || echo "Telegram monitor unavailable"
          curl -fsS --retry 1 --retry-all-errors --retry-delay 3 --max-time 95 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://spb-daily-guide-bot.vercel.app/api/crypto-algorithms-cron"
