name: Verify v2.94 build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: |
          node --check public/app.js
          node --check public/mood-history.js
          node --check public/profile-supplements.js
          node --check api/partner-message.js
          node --check api/mood-analysis-store.cjs
      - run: npm run build
      - run: |
          node -e "JSON.parse(require('fs').readFileSync('rudi-version.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8'));"
