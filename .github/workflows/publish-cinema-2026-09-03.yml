name: Verify Mirage source set 2026-09-03

"on": push

permissions:
  contents: read

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Load Sept 3 premieres without Telegram
        run: |
          node <<'NODE'
          const { loadMiragePremieresWithFallback } = require('./api/cinema-premieres-collage.cjs');
          const config = require('./config/events.json');
          (async () => {
            const rows = await loadMiragePremieresWithFallback('2026-09-03', config.cinemaPremieres.mirage, {
              fetchImpl: globalThis.fetch,
              attempts: 2,
              timeoutMs: 15000,
            });
            console.log(JSON.stringify({ count: rows.length, titles: rows.map((x) => x.title), urls: rows.map((x) => x.sourceUrl) }, null, 2));
            if (rows.length < 7) process.exitCode = 2;
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
