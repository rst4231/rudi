name: Diagnose Mirage listing cards 2026-09-03

"on": push

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Sept 3 listing card markup
        run: |
          set -euo pipefail
          curl --silent --show-error --location 'https://app.mirage.ru/' -o /tmp/page.html
          grep -n -B 18 -A 25 'с 03 Сентября' /tmp/page.html | head -n 500 || true
