name: Diagnose Mirage 2026-09-03

"on": push

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Mirage film links
        run: |
          set -euo pipefail
          for base in https://app.mirage.ru/ https://online.mirage.ru/ https://new-print.mirage.ru/ https://film.mirage.ru/; do
            echo "=== $base ==="
            curl --silent --show-error --location "$base" -o /tmp/mirage.html
            echo "bytes=$(wc -c </tmp/mirage.html)"
            grep -oE 'href=["'"'][^"'"']*/film/[0-9]+[^"'"']*["'"']' /tmp/mirage.html | sed -E 's/^href=["'"']|["'"']$//g' | sort -u | tail -n 80 || true
            for title in 'Сыграть в ящик' 'Миа и монстры' 'Турбулентность'; do
              echo "--- $title ---"
              grep -n -B 4 -A 4 "$title" /tmp/mirage.html | head -n 40 || true
            done
          done
