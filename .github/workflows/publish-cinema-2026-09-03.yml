name: Publish Cinema 2026-09-03

"on": push

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose complete Sept 3 cinema digest
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          status="$(curl --silent --show-error -o "$tmp" -w '%{http_code}' -X POST 'https://spb-daily-guide-bot.vercel.app/api/admin' -H 'content-type: application/json' --data '{"action":"publish-section","section":"cinema","date":"2026-09-03","force":true}')"
          cat "$tmp"
          echo
          echo "HTTP_STATUS=$status"
          test "$status" = "200"
