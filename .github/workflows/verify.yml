name: Verify RUDI

on:
  push:
    branches: [main, rudi-smart-home-cards-20260922]
    paths:
      - 'runtime/**'
      - 'api/**'
      - 'public/**'
      - 'build.cjs'
      - 'rudi-version.json'
      - 'playwright.config.cjs'
      - 'package.json'
      - 'vercel.json'
      - 'tests/**'
      - '.github/workflows/verify.yml'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build
      - run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8'));"
