name: Diagnose Mirage schedule source 2026-09-03

"on": push

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Check generic and dated schedule pages
        run: |
          node <<'NODE'
          const { loadMiragePremieres } = require('./api/cinema-premieres.cjs');
          const urls = [
            'https://app.mirage.ru/spb/schedule/',
            'https://app.mirage.ru/spb/schedule/03.09.2026/'
          ];
          (async () => {
            for (const url of urls) {
              try {
                const rows = await loadMiragePremieres('2026-09-03', { name: 'Мираж Синема Санкт-Петербург', url }, {
                  fetchImpl: globalThis.fetch,
                  attempts: 2,
                  timeoutMs: 15000,
                });
                console.log(JSON.stringify({ url, count: rows.length, titles: rows.map((x) => x.title) }, null, 2));
              } catch (error) {
                console.log(JSON.stringify({ url, error: String(error?.message || error) }));
              }
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
