name: Verify RUDI v0.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-v01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --test tests/rudi-v01-ui.test.cjs tests/ticktick-calendar.test.cjs
      - run: node --check api/partner-message.js
      - run: node --check api/ticktick-client.cjs
      - run: npm run build
      - run: node -e "JSON.parse(require('fs').readFileSync('rudi-version.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8'));"
