name: Publish corrected Sept 3 cinema

"on": push

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish corrected cinema digest
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -L -X POST -H 'content-type: application/json' --data '{"action":"publish-section","section":"cinema","date":"2026-09-03","force":true}' -o /tmp/result.json -w '%{http_code}' 'https://spb-daily-guide-bot.vercel.app/api/admin')
          echo "HTTP $status"
          cat /tmp/result.json
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('/tmp/result.json','utf8')); const n=b?.metadata?.nativeResult||b?.nativeResult||b; console.log(JSON.stringify({published:n?.published,messageId:n?.messageId,titles:n?.titles,manualCount:n?.manualCount},null,2)); if(!(Number(n?.published)>=7 && n?.messageId)) process.exit(2);"
