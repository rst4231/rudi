name: Apply cinema detail host fix

"on": push

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Apply minimal detail-host support
        run: |
          python3 <<'PY'
          from pathlib import Path

          premieres = Path('api/cinema-premieres.cjs')
          text = premieres.read_text()
          old = "links = uniqueBy([...links, ...mirageGapLinks(links, sourceConfig.url)], (row) => row.id);"
          new = "links = uniqueBy([...links, ...mirageGapLinks(links, sourceConfig.gapProbeBaseUrl || sourceConfig.url)], (row) => row.id);"
          if old not in text:
              raise SystemExit('cinema gap host marker not found')
          premieres.write_text(text.replace(old, new, 1))

          events = Path('api/events-config.cjs')
          text = events.read_text()
          old = """  const fallbackUrls = [...new Set((Array.isArray(source.fallbackUrls) ? source.fallbackUrls : []).map((value, index) => assertHttpUrl(value, `cinema.${type}.fallbackUrls[${index}]`)))];
  return { name: String(source.name || fallbackName).trim(), url: assertHttpUrl(source.url || fallbackUrl, `cinema.${type}.url`), fallbackUrls };
"""
          new = """  const fallbackUrls = [...new Set((Array.isArray(source.fallbackUrls) ? source.fallbackUrls : []).map((value, index) => assertHttpUrl(value, `cinema.${type}.fallbackUrls[${index}]`)))];
  const gapProbeBaseUrl = source.gapProbeBaseUrl ? assertHttpUrl(source.gapProbeBaseUrl, `cinema.${type}.gapProbeBaseUrl`) : null;
  return { name: String(source.name || fallbackName).trim(), url: assertHttpUrl(source.url || fallbackUrl, `cinema.${type}.url`), fallbackUrls, gapProbeBaseUrl };
"""
          if old not in text:
              raise SystemExit('events config source marker not found')
          events.write_text(text.replace(old, new, 1))
          PY
      - name: Verify focused regressions
        run: node --test tests/cinema-mirage-gap-host.test.cjs tests/cinema-premieres-completeness.test.cjs tests/cinema-mirage-empty-fallback.test.cjs
      - name: Commit fix
        run: |
          git config user.name rst4231
          git config user.email cpateammail@gmail.com
          git add api/cinema-premieres.cjs api/events-config.cjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: route Mirage gap probes through detail host'
          git push origin HEAD:main
