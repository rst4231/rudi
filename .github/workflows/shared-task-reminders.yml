name: RUDI Shared Task Reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rudi-shared-task-reminders
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Notify owners of due shared tasks
        shell: bash
        env:
          OIDC_AUDIENCE: rudi-shared-task-reminders
          RUDI_ENDPOINT: https://spb-daily-guide-bot.vercel.app/api/shared-task-reminders-cron
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          TOKEN="$(printf '%s' "${OIDC_RESPONSE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsS --retry 1 --retry-delay 2 --max-time 110 \
            -H "Authorization: Bearer ${TOKEN}" \
            "${RUDI_ENDPOINT}"
