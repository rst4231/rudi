name: Verify RUDI v2.94 prep

on:
  push:
    branches: [rudi-v2.94-prep]

permissions:
  contents: read

jobs:
  verify-v294:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check public/app.js
          node --check public/mood-history.js
          node --check public/profile-supplements.js
          node --check api/partner-message.js
          node --check api/mood-analysis-store.cjs
      - name: Targeted v2.94 tests
        run: node --test tests/v2.94-mood-collapse.test.cjs
      - name: Build
        run: node build.cjs
      - name: Targeted tests after build
        run: node --test tests/v2.94-mood-collapse.test.cjs
      - name: Metadata JSON
        run: node -e "JSON.parse(require('fs').readFileSync('rudi-version.json','utf8'))"
