name: Verify RUDI migration once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and test
        run: |
          set -euo pipefail
          npm install
          npm test
          npm run build
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8'));"
          test "$(find runtime -maxdepth 1 -name 'chunk*.txt' | wc -l)" -eq 7
          ! grep -R -E 'rst4231/botsandsite|traffic-news-telegram-bot|prj_oeVaHSb17REkd4rZGsJrRIybPRG7|\[rudi\]' api build.cjs package.json vercel.json
      - name: Record successful verification
        run: |
          set -euo pipefail
          mkdir -p verification
          printf 'verified_commit=%s\nnode=24\nstatus=passed\n' "$GITHUB_SHA" > verification/last-success.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/last-success.txt
          git commit -m 'test: record successful RUDI migration verification'
          git push
