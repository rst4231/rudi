name: Find Turbulence Mirage id

"on": push

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe missing Mirage ids concurrently
        run: |
          node <<'NODE'
          const decode = (s) => String(s || '').replace(/&nbsp;|&#160;/gi, ' ').replace(/&amp;/gi, '&').replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'").replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          const ids = [7533, 7539, 7541, 7543, 7544, 7545, 7546, 7555, 7556, 7557, 7558, 7559, 7560, 7561, 7562];
          (async () => {
            const results = await Promise.all(ids.map(async (id) => {
              const url = `https://www.mirage.ru/film/${id}/`;
              try {
                const response = await fetch(url, { redirect: 'follow', headers: { 'user-agent': 'Mozilla/5.0' }, signal: AbortSignal.timeout(6000) });
                if (!response.ok) return null;
                const html = await response.text();
                const h1 = html.match(/<h1\b[^>]*>([\s\S]*?)<\/h1>/i)?.[1] || '';
                const title = decode(h1);
                const text = decode(html);
                if (!/турбулентност/i.test(`${title} ${text}`)) return null;
                const poster = html.match(/https?:\/\/cdn\.mirage\.ru\/images\/film\/\d+\/(?:big|small)\/[sp]\d+\.jpg[^"'<>\s]*/i)?.[0] || null;
                return { id, requestedUrl: url, finalUrl: response.url, title, hasSept3: /с\s+0?3\s+сентября/i.test(text), poster };
              } catch (error) {
                return { id, error: String(error?.message || error) };
              }
            }));
            const found = results.filter((x) => x && !x.error);
            console.log('TURBULENCE_RESULT ' + JSON.stringify(found, null, 2));
            if (!found.length) {
              console.log('PROBE_ERRORS ' + JSON.stringify(results.filter((x) => x?.error), null, 2));
              process.exit(2);
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
