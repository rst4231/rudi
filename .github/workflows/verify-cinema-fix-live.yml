name: Find Turbulence Mirage id

"on": push

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe recent Mirage film ids
        run: |
          node <<'NODE'
          const decode = (s) => String(s || '').replace(/&nbsp;|&#160;/gi, ' ').replace(/&amp;/gi, '&').replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'").replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          (async () => {
            const found = [];
            for (let id = 7525; id <= 7565; id += 1) {
              const url = `https://www.mirage.ru/film/${id}/`;
              try {
                const response = await fetch(url, { redirect: 'follow', headers: { 'user-agent': 'Mozilla/5.0' } });
                if (!response.ok) continue;
                const html = await response.text();
                const h1 = html.match(/<h1\b[^>]*>([\s\S]*?)<\/h1>/i)?.[1] || '';
                const title = decode(h1);
                const text = decode(html);
                if (!/турбулентност/i.test(`${title} ${text}`)) continue;
                const poster = html.match(/https?:\/\/cdn\.mirage\.ru\/images\/film\/\d+\/(?:big|small)\/[sp]\d+\.jpg[^"'<>\s]*/i)?.[0] || null;
                found.push({ id, requestedUrl: url, finalUrl: response.url, title, hasSept3: /с\s+0?3\s+сентября/i.test(text), poster });
              } catch (error) {
                console.log(JSON.stringify({ id, error: String(error?.message || error) }));
              }
            }
            console.log('TURBULENCE_RESULT ' + JSON.stringify(found, null, 2));
            if (!found.length) process.exit(2);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
