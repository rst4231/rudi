name: Inspect live Mirage film ids

"on": push

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Print linked Mirage ids around current releases
        run: |
          node <<'NODE'
          const { extractMirageFilmLinks } = require('./api/cinema-premieres.cjs');
          (async () => {
            const response = await fetch('https://app.mirage.ru/', { headers: { 'user-agent': 'Mozilla/5.0' } });
            const html = await response.text();
            const links = extractMirageFilmLinks(html, 'https://app.mirage.ru/');
            const ids = links.map((row) => Number(row.id)).filter(Number.isInteger).sort((a,b) => a-b);
            console.log(JSON.stringify({ count: ids.length, min: ids[0], max: ids.at(-1), around: ids.filter((id) => id >= 7525 && id <= 7565) }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
