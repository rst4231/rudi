name: Apply cinema gap fix

"on": push

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: recover unlinked Mirage premiere ids') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Apply minimal Mirage loader fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          premieres = Path('api/cinema-premieres.cjs')
          text = premieres.read_text()

          marker = '''function mirageCurrentFilmsUrl(sourceUrl) {
            try {
              const url = new URL(sourceUrl);
              url.pathname = url.pathname.replace(/\\/films\\/soon\\/?$/u, '/films/');
              return url.toString();
            } catch {
              return sourceUrl;
            }
          }

          async function loadMirageFilmItem(item, dateKey, sourceConfig, options) {
          '''
          replacement = '''function mirageCurrentFilmsUrl(sourceUrl) {
            try {
              const url = new URL(sourceUrl);
              url.pathname = url.pathname.replace(/\\/films\\/soon\\/?$/u, '/films/');
              return url.toString();
            } catch {
              return sourceUrl;
            }
          }

          function directMirageFilmLink(sourceUrl) {
            const match = String(sourceUrl || '').match(/\\/film\\/(\\d+)(?:\\/|$)/u);
            if (!match) return null;
            return { id: match[1], url: String(sourceUrl) };
          }

          function mirageGapLinks(links, baseUrl, maxMissingPerGap = 3) {
            const ids = [...new Set((links || [])
              .map((row) => Number(row?.id))
              .filter((id) => Number.isInteger(id) && id > 0))]
              .sort((a, b) => a - b);
            const rows = [];
            for (let index = 1; index < ids.length; index += 1) {
              const previous = ids[index - 1];
              const current = ids[index];
              const missing = current - previous - 1;
              if (missing < 1 || missing > maxMissingPerGap) continue;
              for (let id = previous + 1; id < current; id += 1) {
                const url = absoluteUrl(`/film/${id}/`, baseUrl);
                if (url) rows.push({ id: String(id), url });
              }
            }
            return rows;
          }

          async function loadMirageFilmItem(item, dateKey, sourceConfig, options) {
          '''
          if marker not in text:
              raise SystemExit('helper insertion marker not found')
          text = text.replace(marker, replacement, 1)

          old_loader = '''async function loadMiragePremieres(dateKey, sourceConfig, options = {}) {
            const currentUrl = mirageCurrentFilmsUrl(sourceConfig.url);
            const pageUrls = [...new Set([sourceConfig.url, currentUrl])];
            const pages = await Promise.all(pageUrls.map((url) => fetchText(url, options)));
            const links = uniqueBy(
              pages.flatMap((html, index) => extractMirageFilmLinks(html, pageUrls[index])),
              (row) => row.id,
            ).slice(0, 90);
            const results = await Promise.allSettled(links.map((item) => loadMirageFilmItem(item, dateKey, sourceConfig, options)));
          '''
          new_loader = '''async function loadMiragePremieres(dateKey, sourceConfig, options = {}) {
            const currentUrl = mirageCurrentFilmsUrl(sourceConfig.url);
            const pageUrls = [...new Set([sourceConfig.url, currentUrl])];
            const pages = await Promise.all(pageUrls.map((url) => fetchText(url, options)));
            const direct = directMirageFilmLink(sourceConfig.url);
            let links = uniqueBy([
              ...(direct ? [direct] : []),
              ...pages.flatMap((html, index) => extractMirageFilmLinks(html, pageUrls[index])),
            ], (row) => row.id);
            if (!direct && sourceConfig.scanRecentIdGaps === true) {
              links = uniqueBy([...links, ...mirageGapLinks(links, sourceConfig.url)], (row) => row.id);
            }
            links = links.slice(0, 90);
            const results = await Promise.allSettled(links.map((item) => loadMirageFilmItem(item, dateKey, sourceConfig, options)));
          '''
          if old_loader not in text:
              raise SystemExit('loader replacement marker not found')
          premieres.write_text(text.replace(old_loader, new_loader, 1))

          collage = Path('api/cinema-premieres-collage.cjs')
          text = collage.read_text()
          old_call = '''      const rows = await legacy.loadMiragePremieres(dateKey, { ...sourceConfig, url }, sourceOptions);'''
          new_call = '''      const rows = await legacy.loadMiragePremieres(dateKey, {
                ...sourceConfig,
                url,
                scanRecentIdGaps: url === sourceConfig?.url,
              }, sourceOptions);'''
          if old_call not in text:
              raise SystemExit('fallback call replacement marker not found')
          collage.write_text(text.replace(old_call, new_call, 1))
          PY
      - name: Verify focused regressions
        run: node --test tests/cinema-premieres-completeness.test.cjs tests/cinema-mirage-empty-fallback.test.cjs
      - name: Commit fix
        run: |
          git config user.name rst4231
          git config user.email cpateammail@gmail.com
          git add api/cinema-premieres.cjs api/cinema-premieres-collage.cjs
          git commit -m 'fix: recover unlinked Mirage premiere ids'
          git push origin HEAD:main
