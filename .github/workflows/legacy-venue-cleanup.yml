name: One-time legacy venue cleanup

on:
  push:
    branches: [remove/legacy-venues-rubric]
    paths:
      - '.github/workflows/legacy-venue-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove/legacy-venues-rubric
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Remove legacy venue rubric from source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');

          const root = process.cwd();
          const runtimeDir = path.join(root, 'runtime');

          function removeModule(source, moduleName) {
            const marker = `__mods["${moduleName}"]=function(module,exports,__req,require){`;
            const start = source.indexOf(marker);
            if (start < 0) throw new Error(`Missing ${moduleName}`);
            const next = source.indexOf('\n__mods["', start + marker.length);
            if (next < 0) throw new Error(`Missing module boundary after ${moduleName}`);
            return source.slice(0, start) + source.slice(next + 1);
          }

          function removeTopLevelFunction(source, functionName) {
            const pattern = new RegExp(`\\nfunction ${functionName}\\([^\\n]*\\) \\{[\\s\\S]*?\\n\\}\\n`, 'u');
            if (!pattern.test(source)) throw new Error(`Missing ${functionName}`);
            return source.replace(pattern, '\n');
          }

          const base64 = Array.from({ length: 7 }, (_, index) =>
            fs.readFileSync(path.join(runtimeDir, `chunk${index}.txt`), 'utf8').trim(),
          ).join('');
          let source = zlib.gunzipSync(Buffer.from(base64, 'base64')).toString('utf8');

          source = removeTopLevelFunction(source, 'loadVenueDigestMessageIds');
          source = removeTopLevelFunction(source, 'rememberVenueDigestMessageIds');
          source = source
            .replace(/^.*exports\.loadVenueDigestMessageIds=.*\n/mu, '')
            .replace(/^.*exports\.rememberVenueDigestMessageIds=.*\n/mu, '')
            .replace(/^.*VENUE_D?IGEST.*\n/gimu, '');
          source = removeModule(source, 'src/venues.js');
          source = removeModule(source, 'src/venue-digest.js');
          source = source
            .replace(/^const \{ runVenueDigest \} = __req\("src\/venue-digest\.js"\);\n/mu, '')
            .replace('const ALL=["events","venues","holidays","facts","morning","clients"];', 'const ALL=["events","holidays","facts","morning","clients"];')
            .replace(/^.*Sevkabel\/Brusnitsyn \(venues\).*\n/mu, '')
            .replace(/^\s*await run\("venues",\(\)=>runVenueDigest\(\{dateKey,dryRun\}\)\);\n/mu, '');

          for (const marker of [
            'Севкабель Порт + Брусницын',
            'src/venues.js',
            'src/venue-digest.js',
            'runVenueDigest',
            'fetchVenueEvents',
            'loadVenueDigestMessageIds',
            'rememberVenueDigestMessageIds',
            'run("venues"',
          ]) {
            if (source.includes(marker)) throw new Error(`Legacy venue marker survived: ${marker}`);
          }

          const encoded = zlib.gzipSync(Buffer.from(source, 'utf8'), { level: 9, mtime: 0 }).toString('base64');
          const chunks = [];
          for (let offset = 0; offset < encoded.length; offset += 9000) chunks.push(encoded.slice(offset, offset + 9000));
          if (chunks.length !== 7) throw new Error(`Unexpected clean chunk count: ${chunks.length}`);
          chunks.forEach((value, index) => fs.writeFileSync(path.join(runtimeDir, `chunk${index}.txt`), value));

          const buildPath = path.join(root, 'build.cjs');
          let build = fs.readFileSync(buildPath, 'utf8');
          build = build.replace(
            /const EXPECTED_SIZES = \[[^\]]+\];/u,
            `const EXPECTED_SIZES = [${chunks.map((value) => value.length).join(', ')}];`,
          );
          fs.writeFileSync(buildPath, build);

          const collagePath = path.join(root, 'api', 'event-collage.cjs');
          fs.writeFileSync(collagePath, "const base = require('./event-collage-base.cjs');\nconst { wrapStageEventFetch } = require('./stage-poster.cjs');\n\nfunction withStageEventFetch(options = {}) {\n  const fetchImpl = options.fetchImpl || globalThis.fetch;\n  return { ...options, fetchImpl: wrapStageEventFetch(fetchImpl) };\n}\n\nasync function fetchEventPoster(pageUrl, options = {}) {\n  return base.fetchEventPoster(pageUrl, withStageEventFetch(options));\n}\n\nasync function maybeSendEventCollage(input, init = {}, options = {}) {\n  return base.maybeSendEventCollage(input, init, withStageEventFetch(options));\n}\n\nmodule.exports = {\n  ...base,\n  fetchEventPoster,\n  maybeSendEventCollage,\n};\n");

          const configPath = path.join(root, 'config', 'events.json');
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          delete config.legacyVenueDigest;
          config.version = Math.max(Number(config.version || 0) + 1, 6);
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);

          for (const file of [
            'api/legacy-venue-digest-guard.cjs',
            'tests/legacy-venue-digest-guard.test.cjs',
            'tests/legacy-venue-runtime-regenerator.test.cjs',
            '.github/workflows/legacy-venue-cleanup.yml',
          ]) {
            const target = path.join(root, file);
            if (fs.existsSync(target)) fs.unlinkSync(target);
          }

          console.log('Clean chunk sizes:', chunks.map((value) => value.length).join(','));
          NODE
      - run: npm test
      - run: npm run build
      - name: Commit clean source
        shell: bash
        run: |
          git config user.name 'rst4231'
          git config user.email 'cpateammail@gmail.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Remove legacy Sevkabel and Brusnitsyn rubric entirely'
          git push origin HEAD:remove/legacy-venues-rubric
