<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>RUDI</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = tg?.colorScheme || (dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root{
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      --bg:#f4f5f7;
      --surface:rgba(255,255,255,.75);
      --surface-strong:rgba(255,255,255,.94);
      --surface-hover:rgba(255,255,255,.99);
      --text:#15171c;
      --muted:#7b818c;
      --line:rgba(20,24,32,.09);
      --soft:rgba(25,31,42,.055);
      --shadow:0 18px 44px rgba(35,42,56,.08);
      --shadow-hover:0 24px 64px rgba(35,42,56,.13);
      --glow-a:rgba(73,103,255,.15);
      --glow-b:rgba(145,89,255,.10);
      --avatar-ring:rgba(255,255,255,.76);
      --icon-bg:rgba(67,89,255,.085);
      --icon-stroke:#5266d9;
    }
    html[data-theme="dark"]{
      --bg:#0b0d12;
      --surface:rgba(20,23,31,.74);
      --surface-strong:rgba(24,28,37,.94);
      --surface-hover:rgba(28,32,42,.98);
      --text:#f5f7fb;
      --muted:#8c94a3;
      --line:rgba(255,255,255,.08);
      --soft:rgba(255,255,255,.055);
      --shadow:0 18px 48px rgba(0,0,0,.30);
      --shadow-hover:0 26px 72px rgba(0,0,0,.42);
      --glow-a:rgba(64,96,255,.18);
      --glow-b:rgba(143,70,255,.12);
      --avatar-ring:rgba(255,255,255,.10);
      --icon-bg:rgba(120,137,255,.12);
      --icon-stroke:#aebaff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    html{background:var(--bg);transition:background-color .28s ease}
    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      overflow-x:hidden;
      padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
      color:var(--text);
      background:
        radial-gradient(circle at 12% 8%,var(--glow-a),transparent 34%),
        radial-gradient(circle at 88% 92%,var(--glow-b),transparent 40%),
        var(--bg);
      -webkit-font-smoothing:antialiased;
      transition:background-color .28s ease,color .28s ease;
    }
    body::before,body::after{
      content:"";
      position:fixed;
      width:38vw;height:38vw;
      min-width:240px;min-height:240px;
      max-width:520px;max-height:520px;
      border-radius:50%;
      filter:blur(72px);
      opacity:.22;
      pointer-events:none;
      animation:float 14s ease-in-out infinite alternate;
    }
    body::before{left:-14vw;top:-15vw;background:var(--glow-a)}
    body::after{right:-14vw;bottom:-16vw;background:var(--glow-b);animation-delay:-5s}
    .shell{
      position:relative;
      z-index:1;
      width:min(100%,540px);
      display:grid;
      gap:13px;
    }
    .panel,.profile,.card{
      border:1px solid var(--line);
      background:var(--surface);
      box-shadow:var(--shadow);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
    }
    .profile{
      position:relative;
      overflow:hidden;
      padding:20px;
      border-radius:25px;
      animation:heroIn .58s cubic-bezier(.2,.8,.2,1) both;
    }
    .profile::after{
      content:"";
      position:absolute;
      width:150px;height:150px;
      right:-56px;top:-70px;
      border-radius:50%;
      background:var(--glow-a);
      filter:blur(28px);
      opacity:.35;
      pointer-events:none;
    }
    .identity{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      align-items:center;
      gap:14px;
      min-width:0;
    }
    .avatar{
      position:relative;
      width:66px;height:66px;
      display:grid;
      place-items:center;
      overflow:hidden;
      border:3px solid var(--avatar-ring);
      border-radius:21px;
      background:linear-gradient(145deg,rgba(91,112,255,.30),rgba(145,89,255,.24)),var(--surface-strong);
      box-shadow:0 12px 26px rgba(0,0,0,.12);
      color:var(--text);
      font-size:20px;
      font-weight:780;
      letter-spacing:-.03em;
      user-select:none;
    }
    .avatar img{
      position:absolute;inset:0;
      width:100%;height:100%;
      object-fit:cover;
      opacity:0;
      transition:opacity .25s ease;
    }
    .avatar.has-photo img{opacity:1}
    .person{min-width:0;display:grid;gap:5px}
    .name{
      overflow:hidden;
      color:var(--text);
      font-size:21px;
      line-height:1.12;
      font-weight:790;
      letter-spacing:-.03em;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .profile-meta{
      overflow:hidden;
      color:var(--muted);
      font-size:13px;
      line-height:1.3;
      font-weight:560;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .profile-mood{
      display:flex;
      align-items:center;
      gap:5px;
    }
    .profile-weather{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:auto minmax(0,1fr);
      align-items:center;
      gap:10px;
      margin-top:15px;
      padding-top:14px;
      border-top:1px solid var(--line);
    }
    .profile-weather-main{
      min-width:72px;
      display:flex;
      align-items:baseline;
      gap:6px;
    }
    .profile-weather-value{
      color:var(--text);
      font-size:22px;
      line-height:1;
      font-weight:820;
      letter-spacing:-.035em;
    }
    .profile-weather-city{
      color:var(--muted);
      font-size:11px;
      line-height:1.1;
      font-weight:620;
    }
    .profile-weather-info{
      min-width:0;
      display:grid;
      gap:3px;
    }
    .profile-weather-caption{
      color:var(--text);
      font-size:12px;
      line-height:1.25;
      font-weight:650;
    }
    .profile-weather-rain{
      color:var(--muted);
      font-size:11px;
      line-height:1.3;
      font-weight:560;
    }
    .mood-button{
      width:32px;height:32px;
      display:grid;
      place-items:center;
      padding:0;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--soft);
      color:var(--muted);
      cursor:pointer;
      transition:transform .18s ease,background-color .2s ease,color .2s ease,border-color .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .mood-button:hover{transform:translateY(-2px);color:var(--text)}
    .mood-button:active{transform:scale(.94)}
    .mood-button.selected{
      background:var(--icon-bg);
      color:var(--icon-stroke);
      border-color:var(--line);
    }
    .mood-button svg{width:18px;height:18px}
    .compliment{
      position:relative;
      z-index:1;
      margin-top:17px;
      padding:13px 14px;
      border:1px solid var(--line);
      border-radius:15px;
      background:linear-gradient(135deg,var(--soft),transparent),var(--surface-strong);
      color:var(--text);
      font-size:13.5px;
      line-height:1.45;
      font-weight:620;
      letter-spacing:-.01em;
      animation:fadeUp .5s .08s cubic-bezier(.2,.8,.2,1) both;
    }
    .partner-message{
      padding:18px;
      border-color:color-mix(in srgb,var(--icon-stroke) 24%,var(--line));
      background:
        linear-gradient(135deg,var(--icon-bg),transparent 58%),
        var(--surface);
      animation:fadeUp .52s .03s cubic-bezier(.2,.8,.2,1) both;
    }
    .partner-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }
    .partner-head .panel-label{margin:0}
    .partner-edit{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:34px;
      height:34px;
      padding:0;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--soft);
      color:var(--text);
      cursor:pointer;
      transition:transform .18s ease,background-color .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .partner-edit:hover{transform:translateY(-2px);background:var(--surface-hover)}
    .partner-edit:active{transform:scale(.95)}
    .partner-edit svg{width:17px;height:17px}
    .partner-text{
      color:var(--text);
      font-size:15px;
      line-height:1.5;
      font-weight:650;
      letter-spacing:-.012em;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .partner-empty{
      color:var(--muted);
      font-weight:560;
    }
    .partner-author{
      margin-top:10px;
      color:var(--muted);
      font-size:11.5px;
      line-height:1.3;
      font-weight:560;
    }
    .partner-editor{
      display:none;
      gap:10px;
      margin-top:12px;
    }
    .partner-editor.open{display:grid}
    .partner-editor textarea{
      width:100%;
      min-height:110px;
      resize:vertical;
      padding:12px 13px;
      border:1px solid var(--line);
      border-radius:14px;
      outline:none;
      background:var(--surface-strong);
      color:var(--text);
      font:inherit;
      font-size:14px;
      line-height:1.45;
    }
    .partner-editor textarea:focus{border-color:color-mix(in srgb,var(--icon-stroke) 40%,var(--line))}
    .partner-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
    }
    .partner-action{
      padding:9px 12px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--soft);
      color:var(--text);
      font:inherit;
      font-size:12.5px;
      font-weight:680;
      cursor:pointer;
    }
    .partner-action.primary{
      background:var(--icon-bg);
      color:var(--icon-stroke);
    }
    .partner-status{
      min-height:16px;
      color:var(--muted);
      font-size:11px;
      line-height:1.3;
    }
    .dashboard{display:grid;gap:11px}
    .panel{
      position:relative;
      overflow:hidden;
      border-radius:21px;
    }
    .nearest-panel{padding:17px 18px;animation:fadeUp .52s .05s cubic-bezier(.2,.8,.2,1) both}
    .panel-label{
      margin-bottom:9px;
      color:var(--muted);
      font-size:10.5px;
      line-height:1.2;
      font-weight:730;
      letter-spacing:.07em;
      text-transform:uppercase;
    }
    .nearest-content{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:16px;
    }
    .nearest-title{
      color:var(--text);
      font-size:16px;
      line-height:1.25;
      font-weight:750;
      letter-spacing:-.018em;
    }
    .nearest-meta{
      margin-top:4px;
      color:var(--muted);
      font-size:12.5px;
      line-height:1.3;
      font-weight:540;
    }
    .nearest-days{
      min-width:82px;
      padding:10px 12px;
      border-radius:14px;
      background:var(--icon-bg);
      color:var(--icon-stroke);
      font-size:13px;
      line-height:1.1;
      font-weight:780;
      text-align:center;
      white-space:nowrap;
    }
    .content-pair{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:11px;
    }
    .idea-text{
      color:var(--text);
      font-size:14px;
      line-height:1.45;
      font-weight:620;
      letter-spacing:-.01em;
    }
    .suggestions{
      display:grid;
      gap:11px;
    }
    .suggestion{
      padding:16px;
      min-width:0;
      animation:fadeUp .52s .15s cubic-bezier(.2,.8,.2,1) both;
    }
    .suggestion-value{
      color:var(--text);
      font-size:14px;
      line-height:1.35;
      font-weight:680;
      letter-spacing:-.012em;
    }
    .links{display:grid;gap:10px}
    .card{
      position:relative;
      isolation:isolate;
      min-height:72px;
      display:grid;
      grid-template-columns:42px minmax(0,1fr) 32px;
      align-items:center;
      gap:13px;
      padding:14px 16px 14px 14px;
      overflow:hidden;
      border-radius:19px;
      color:var(--text);
      text-decoration:none;
      opacity:0;
      transform:translateY(12px) scale(.986);
      animation:cardIn .5s cubic-bezier(.2,.8,.2,1) forwards;
      transition:transform .22s cubic-bezier(.2,.8,.2,1),background-color .25s ease,box-shadow .25s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .card:nth-child(1){animation-delay:.08s}
    .card:nth-child(2){animation-delay:.14s}
    .card:nth-child(3){animation-delay:.20s}
    .card:hover{transform:translateY(-3px) scale(1.006);background:var(--surface-hover);box-shadow:var(--shadow-hover)}
    .card:active{transform:scale(.985)}
    .feature-icon{
      width:42px;height:42px;
      display:grid;place-items:center;
      border-radius:14px;
      background:var(--icon-bg);
      color:var(--icon-stroke);
      transition:transform .25s ease;
    }
    .feature-icon svg{width:23px;height:23px}
    .card:hover .feature-icon{transform:scale(1.06) rotate(-2deg)}
    .label{
      min-width:0;
      overflow:hidden;
      color:var(--text);
      font-size:15.5px;
      line-height:1.25;
      font-weight:720;
      letter-spacing:-.018em;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .arrow{
      width:32px;height:32px;
      display:grid;place-items:center;
      border-radius:10px;
      background:var(--soft);
      color:var(--text);
    }
    .arrow svg{width:16px;height:16px}
    .footer{
      display:grid;
      justify-items:center;
      gap:9px;
      padding:8px 0 2px;
      color:var(--muted);
      font-size:12.5px;
      line-height:1.3;
      animation:fadeUp .5s .28s cubic-bezier(.2,.8,.2,1) both;
    }
    .telegram-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 12px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--surface);
      color:var(--text);
      text-decoration:none;
      font-weight:650;
      transition:transform .18s ease,background-color .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .telegram-link:hover{transform:translateY(-2px);background:var(--surface-hover)}
    .telegram-link:active{transform:scale(.97)}
    .telegram-link svg{width:18px;height:18px;color:var(--icon-stroke)}
    @keyframes heroIn{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(30px,20px,0) scale(1.08)}}
    @media(max-width:430px){
      body{padding-left:14px;padding-right:14px}
      .profile{padding:18px;border-radius:22px}
      .identity{gap:12px}
      .avatar{width:60px;height:60px;border-radius:19px}
      .name{font-size:19px}
      .profile-meta{font-size:12px}
      .mood-button{width:29px;height:29px;border-radius:9px}
      .mood-button svg{width:16px;height:16px}
      .profile-weather{gap:9px}
      .profile-weather-value{font-size:20px}
      .content-pair{grid-template-columns:1fr 1fr}
      .suggestion{padding:15px}
    }
    @media(max-width:370px){
      .identity{grid-template-columns:auto minmax(0,1fr)}
      .profile-mood{grid-column:2;justify-content:flex-start}
      .content-pair{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
      .card{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="profile" aria-label="Профиль">
      <div class="identity">
        <div id="avatar" class="avatar" aria-hidden="true">
          <span id="initials">R</span>
          <img id="avatarImage" alt="">
        </div>
        <div class="person">
          <div id="displayName" class="name">RUDI</div>
          <div id="profileMeta" class="profile-meta"></div>
        </div>
        <div class="profile-mood" role="group" aria-label="Настроение сегодня">
          <button class="mood-button" type="button" data-mood="low" aria-label="Не очень" title="Не очень">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M8.7 9.6h.01M15.3 9.6h.01M9.1 16c1.7-1.7 4.1-1.7 5.8 0"/></svg>
          </button>
          <button class="mood-button" type="button" data-mood="ok" aria-label="Нормально" title="Нормально">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M8.7 9.6h.01M15.3 9.6h.01M9.3 15h5.4"/></svg>
          </button>
          <button class="mood-button" type="button" data-mood="great" aria-label="Отлично" title="Отлично">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M8.7 9.6h.01M15.3 9.6h.01M8.8 14.3c1.7 2.1 4.7 2.1 6.4 0"/></svg>
          </button>
        </div>
      </div>

      <div class="profile-weather" aria-label="Погода">
        <div class="profile-weather-main">
          <div id="weatherValue" class="profile-weather-value">—</div>
          <div id="weatherCity" class="profile-weather-city">СПб</div>
        </div>
        <div class="profile-weather-info">
          <div id="weatherCaption" class="profile-weather-caption">Проверяю погоду…</div>
          <div id="weatherRain" class="profile-weather-rain">Проверяю дождь…</div>
        </div>
      </div>

      <div id="compliment" class="compliment"></div>
    </section>

    <section class="panel partner-message" aria-label="Послание для партнёра">
      <div class="partner-head">
        <div class="panel-label">Послание для партнёра</div>
        <button id="partnerEditButton" class="partner-edit" type="button" aria-label="Изменить послание" title="Изменить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20h4l11-11-4-4L4 16v4Z"/>
            <path d="m13.5 6.5 4 4"/>
          </svg>
        </button>
      </div>
      <div id="partnerMessageText" class="partner-text partner-empty">Здесь можно оставить послание друг для друга.</div>
      <div id="partnerMessageAuthor" class="partner-author"></div>
      <div id="partnerEditor" class="partner-editor">
        <textarea id="partnerMessageInput" maxlength="1000" placeholder="Напишите послание…"></textarea>
        <div class="partner-actions">
          <button id="partnerCancelButton" class="partner-action" type="button">Отмена</button>
          <button id="partnerSaveButton" class="partner-action primary" type="button">Сохранить</button>
        </div>
        <div id="partnerStatus" class="partner-status"></div>
      </div>
    </section>

    <section class="dashboard" aria-label="Сегодня">
      <article class="panel nearest-panel">
        <div class="panel-label">Ближайшее</div>
        <div class="nearest-content">
          <div>
            <div id="nearestTitle" class="nearest-title"></div>
            <div id="nearestMeta" class="nearest-meta"></div>
          </div>
          <div id="nearestDays" class="nearest-days"></div>
        </div>
      </article>

      <div class="content-pair">
        <article class="panel suggestion">
          <div class="panel-label">Идея дня</div>
          <div id="dailyIdea" class="idea-text"></div>
        </article>
        <article class="panel suggestion">
          <div class="panel-label">Что посмотреть</div>
          <div id="watchToday" class="suggestion-value"></div>
        </article>
      </div>

      <div class="suggestions">
        <article class="panel suggestion">
          <div class="panel-label">Что приготовить</div>
          <div id="cookToday" class="suggestion-value"></div>
        </article>
      </div>

    </section>

    <nav class="links" aria-label="Инструменты">
      <a class="card" href="https://gemini.google.com/share/a09a924c005c" target="_blank" rel="noopener noreferrer">
        <span class="feature-icon" aria-hidden="true">

    <footer class="footer">
      <div>© <span id="currentYear"></span></div>
      <div><span id="streakValue">1</span> <span id="streakCaption">день подряд</span> в RUDI</div>
      <a class="telegram-link" href="https://t.me/+fiPsnWoBJ-c0ZmU1" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20.9 4.2 17.8 19c-.23 1.04-.83 1.3-1.68.81l-4.72-3.48-2.28 2.19c-.25.25-.46.46-.94.46l.34-4.81 8.75-7.91c.38-.34-.08-.53-.59-.19L5.86 12.88 1.2 11.42C.19 11.1.17 10.4 1.41 9.91L19.63 2.9c.84-.31 1.58.19 1.27 1.3Z" fill="currentColor"/>

  </main>

  <script>
    (() => {
      const TZ = 'Europe/Moscow';
      const CONFIG_URL = 'https://raw.githubusercontent.com/rst4231/rudi/main/rudi-config.json';
      const root = document.documentElement;
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const tg = window.Telegram?.WebApp;
      const DAY = 86400000;

      const fallback = {
        weather:{enabled:true,city:'Санкт-Петербург',latitude:59.9386,longitude:30.3141,timezone:TZ},
        birthdays:[
          {id:'rustam',name:'Рустам',year:1992,month:3,day:3},
          {id:'diana',name:'Диана',year:1996,month:6,day:30}
        ],
        importantDates:[{id:'new-year',title:'Новый год',month:1,day:1,recurring:true}],
        dailyIdeas:['Сделать небольшую прогулку без телефона.','Попробовать сегодня новый рецепт.','Устроить вечером час без соцсетей.','Написать близкому человеку что-нибудь приятное.'],
        watchList:['Достать ножи','Интерстеллар','Одержимость','Зелёная книга'],
        cookList:['Паста карбонара','Шакшука','Курица терияки с рисом','Сырники'],
        compliments:{
          male:['Сегодня ты выглядишь особенно уверенно.','У тебя отличный настрой — это чувствуется.','Сегодня определённо твой день.'],
          female:['Сегодня ты особенно прекрасно выглядишь.','У тебя очень приятная энергия сегодня.','Сегодня определённо твой день.'],
          neutral:['Сегодня отличный день, чтобы сделать что-то приятное для себя.','Пусть сегодняшний день приятно удивит.'],
          surpriseChance:.12,
          surprises:['Сегодня можно нарушить привычный сценарий и сделать что-нибудь неожиданно приятное.']
        }
      };

      function applyTheme(){
        const theme = tg?.colorScheme || (media.matches ? 'dark' : 'light');
        root.dataset.theme = theme;
        metaTheme.setAttribute('content',theme === 'dark' ? '#0b0d12' : '#f4f5f7');
        try{
          tg?.setHeaderColor?.(theme === 'dark' ? '#0b0d12' : '#f4f5f7');
          tg?.setBackgroundColor?.(theme === 'dark' ? '#0b0d12' : '#f4f5f7');
          tg?.setBottomBarColor?.(theme === 'dark' ? '#0b0d12' : '#f4f5f7');
        }catch(_){}
      }

      applyTheme();
      tg?.ready?.();
      tg?.expand?.();
      tg?.onEvent?.('themeChanged',applyTheme);
      media.addEventListener?.('change',()=>{if(!tg?.initData) applyTheme()});

      const user = tg?.initDataUnsafe?.user;
      const displayName = document.getElementById('displayName');
      const avatar = document.getElementById('avatar');
      const avatarImage = document.getElementById('avatarImage');
      const initials = document.getElementById('initials');
      let firstName = '';

      if(user){
        const fullName = [user.first_name,user.last_name].filter(Boolean).join(' ').trim() || 'Пользователь';
        firstName = (user.first_name || '').trim();
        displayName.textContent = fullName;
        const parts = [user.first_name,user.last_name].filter(Boolean);
        initials.textContent = (parts.length ? parts.map(part=>part.charAt(0)).join('') : 'T').slice(0,2).toUpperCase();
        if(user.photo_url){
          avatarImage.src = user.photo_url;
          avatarImage.alt = 'Фото профиля ' + fullName;
          avatarImage.addEventListener('load',()=>avatar.classList.add('has-photo'),{once:true});
          avatarImage.addEventListener('error',()=>avatar.classList.remove('has-photo'),{once:true});
        }
      }

      function getMoscowParts(date=new Date()){
        return Object.fromEntries(
          new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric'})
            .formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)])
        );
      }

      function todayState(){
        const p = getMoscowParts();
        const utc = Date.UTC(p.year,p.month-1,p.day);
        const key = [p.year,String(p.month).padStart(2,'0'),String(p.day).padStart(2,'0')].join('-');
        return {parts:p,utc,key};
      }

      function updateClock(){
        const now = new Date();
        const weekdayRaw = new Intl.DateTimeFormat('ru-RU',{weekday:'short',timeZone:TZ}).format(now);
        const weekday = weekdayRaw.replace('.', '').toUpperCase();
        const date = new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',timeZone:TZ}).format(now);
        const time = new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:TZ}).format(now);
        document.getElementById('profileMeta').textContent = weekday+' · '+date+' · '+time;
      }
      updateClock();
      setInterval(updateClock,30000);

      document.getElementById('currentYear').textContent = new Intl.DateTimeFormat('en',{year:'numeric',timeZone:TZ}).format(new Date());

      function dayWord(value){
        const mod10=value%10, mod100=value%100;
        if(mod10===1 && mod100!==11) return 'день';
        if(mod10>=2 && mod10<=4 && (mod100<12 || mod100>14)) return 'дня';
        return 'дней';
      }
      function daysLabel(days){return days===0?'сегодня':days+' '+dayWord(days)}
      function streakWord(value){
        const mod10=value%10, mod100=value%100;
        if(mod10===1 && mod100!==11) return 'день подряд';
        if(mod10>=2 && mod10<=4 && (mod100<12 || mod100>14)) return 'дня подряд';
        return 'дней подряд';
      }
      function dateLabel(month,day){
        return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(Date.UTC(2024,month-1,day)));
      }
      function nextOccurrence(month,day){
        const {parts,utc}=todayState();
        let target=Date.UTC(parts.year,month-1,day);
        let year=parts.year;
        if(target<utc){year++;target=Date.UTC(year,month-1,day)}
        return {year,days:Math.round((target-utc)/DAY),target};
      }
      function detectNameType(name){
        const value=String(name||'').trim().toLowerCase();
        if(!value) return 'neutral';
        const male=new Set(['александр','алексей','андрей','антон','артем','артём','вадим','валерий','виктор','владимир','владислав','дмитрий','евгений','егор','иван','илья','кирилл','константин','максим','михаил','никита','николай','олег','павел','роман','руслан','рустам','сергей','станислав','тимур','федор','фёдор','юрий']);
        const female=new Set(['александра','алёна','алена','алина','алиса','анастасия','анна','валерия','виктория','дарья','диана','екатерина','елена','ирина','карина','кристина','ксения','марина','мария','наталья','ольга','полина','светлана','софия','софья','татьяна','юлия']);
        if(male.has(value)) return 'male';
        if(female.has(value)) return 'female';
        if(/[ая]$/.test(value)&&!/(никита|илья|кузьма|фома|лука)$/.test(value)) return 'female';
        if(/(й|н|р|м|л|в|г|д|т|с|б|п|к|ч|ш|ж|ф)$/.test(value)) return 'male';
        return 'neutral';
      }
      function secureRandom(){if(window.crypto?.getRandomValues){const a=new Uint32Array(1);window.crypto.getRandomValues(a);return a[0]/4294967296}return Math.random()}
      function randomItem(list){return list[Math.floor(secureRandom()*list.length)]}

      async function loadConfig(){
        try{
          const response=await fetch(CONFIG_URL+'?t='+Date.now(),{cache:'no-store'});
          if(!response.ok) throw new Error('config');
          const remote=await response.json();
          return {...fallback,...remote,compliments:{...fallback.compliments,...remote.compliments},weather:{...fallback.weather,...remote.weather}};
        }catch(_){return fallback}
      }

      async function loadWeather(cfg){
        const elValue=document.getElementById('weatherValue');
        const elCaption=document.getElementById('weatherCaption');
        const elRain=document.getElementById('weatherRain');
        const elCity=document.getElementById('weatherCity');
        if(!cfg?.enabled){
          elCaption.textContent='Погода выключена';
          elRain.textContent='Прогноз дождя выключен';
          return;
        }
        try{
          const query=[
            'latitude='+encodeURIComponent(cfg.latitude),
            'longitude='+encodeURIComponent(cfg.longitude),
            'current=temperature_2m,apparent_temperature,weather_code,precipitation,rain',
            'hourly=precipitation_probability,precipitation,rain',
            'forecast_days=1',
            'timezone='+encodeURIComponent(cfg.timezone||TZ)
          ].join('&');
          const r=await fetch('https://api.open-meteo.com/v1/forecast?'+query,{cache:'no-store'});
          if(!r.ok) throw new Error('weather');
          const data=await r.json();
          const c=data.current||{};
          const labels={0:'Ясно',1:'Преимущественно ясно',2:'Облачно',3:'Пасмурно',45:'Туман',48:'Туман',51:'Морось',53:'Морось',55:'Морось',61:'Дождь',63:'Дождь',65:'Сильный дождь',71:'Снег',73:'Снег',75:'Сильный снег',80:'Ливень',81:'Ливень',82:'Сильный ливень',95:'Гроза'};

          const times=Array.isArray(data.hourly?.time)?data.hourly.time:[];
          const probabilities=Array.isArray(data.hourly?.precipitation_probability)?data.hourly.precipitation_probability:[];
          const precipitation=Array.isArray(data.hourly?.precipitation)?data.hourly.precipitation:[];
          const rain=Array.isArray(data.hourly?.rain)?data.hourly.rain:[];
          const currentHour=String(c.time||'').slice(0,13)+':00';
          let start=times.indexOf(currentHour);
          if(start<0) start=times.findIndex(time=>String(time)>=currentHour);
          if(start<0) start=0;

          const end=Math.min(times.length,start+7);
          const nextProb=probabilities.slice(start,end).map(Number).filter(Number.isFinite);
          const nextPrecip=precipitation.slice(start,end).map(Number).filter(Number.isFinite);
          const nextRain=rain.slice(start,end).map(Number).filter(Number.isFinite);
          const maxProbability=nextProb.length?Math.max(...nextProb):0;
          const totalPrecip=nextPrecip.reduce((sum,value)=>sum+value,0);
          const totalRain=nextRain.reduce((sum,value)=>sum+value,0);
          const rainingNow=Number(c.rain||0)>0 || Number(c.precipitation||0)>0;

          let rainText;
          if(rainingNow){
            rainText='Дождь идёт сейчас · зонт нужен';
          }else if(maxProbability>=60 || totalRain>=0.5 || totalPrecip>=0.8){
            rainText='Дождь вероятен в ближайшие часы · лучше взять зонт';
          }else if(maxProbability>=30 || totalRain>0 || totalPrecip>0){
            rainText='Небольшой дождь возможен · зонт по желанию';
          }else{
            rainText='Дождя не ожидается · зонт не нужен';
          }

          elValue.textContent=Math.round(c.temperature_2m)+'°';
          elCity.textContent=cfg.city==='Санкт-Петербург'?'СПб':(cfg.city||'');
          elCaption.textContent=labels[c.weather_code]||'Погода';
          elRain.textContent=rainText;
        }catch(_){
          elValue.textContent='—';
          elCaption.textContent='Погода недоступна';
          elRain.textContent='Не удалось проверить дождь';
        }
      }

      function renderNearest(config){
        const events=[];
        for(const b of config.birthdays||[]){
          const n=nextOccurrence(b.month,b.day);
          events.push({
            title:'День рождения '+b.name,
            meta:dateLabel(b.month,b.day)+' · исполнится '+(n.year-b.year),
            days:n.days,target:n.target
          });
        }
        for(const e of config.importantDates||[]){
          if(!e.month||!e.day) continue;
          const n=nextOccurrence(e.month,e.day);
          events.push({title:e.title,meta:dateLabel(e.month,e.day),days:n.days,target:n.target});
        }
        events.sort((a,b)=>a.target-b.target);
        const e=events[0];
        if(!e) return;
        document.getElementById('nearestTitle').textContent=e.title;
        document.getElementById('nearestMeta').textContent=e.meta;
        document.getElementById('nearestDays').textContent=daysLabel(e.days);
      }

      function formatPartnerUpdatedAt(value){
        const date=new Date(value);
        if(Number.isNaN(date.getTime())) return '';
        return new Intl.DateTimeFormat('ru-RU',{
          day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:TZ
        }).format(date);
      }

      function renderPartnerMessage(message){
        const textEl=document.getElementById('partnerMessageText');
        const authorEl=document.getElementById('partnerMessageAuthor');
        if(!message?.text){
          textEl.textContent='Здесь можно оставить послание друг для друга.';
          textEl.classList.add('partner-empty');
          authorEl.textContent='';
          return;
        }
        textEl.textContent=message.text;
        textEl.classList.remove('partner-empty');
        const when=formatPartnerUpdatedAt(message.updatedAt);
        authorEl.textContent='Написал(а): '+message.authorName+(when?' · '+when:'');
      }

      async function loadPartnerMessage(){
        try{
          const r=await fetch('/api/partner-message',{cache:'no-store'});
          if(!r.ok) throw new Error('partner-message');
          const data=await r.json();
          renderPartnerMessage(data.message);
          return data.message||null;
        }catch(_){
          const textEl=document.getElementById('partnerMessageText');
          textEl.textContent='Не удалось загрузить послание.';
          textEl.classList.add('partner-empty');
          return null;
        }
      }

      function setupPartnerMessage(){
        const editButton=document.getElementById('partnerEditButton');
        const editor=document.getElementById('partnerEditor');
        const input=document.getElementById('partnerMessageInput');
        const saveButton=document.getElementById('partnerSaveButton');
        const cancelButton=document.getElementById('partnerCancelButton');
        const status=document.getElementById('partnerStatus');
        let currentMessage=null;

        const canEdit=Boolean(tg?.initData);
        if(!canEdit){
          editButton.disabled=true;
          editButton.style.opacity='.45';
          editButton.title='Редактирование доступно внутри Telegram';
        }

        const closeEditor=()=>{
          editor.classList.remove('open');
          status.textContent='';
        };

        editButton.addEventListener('click',()=>{
          if(!canEdit) return;
          input.value=currentMessage?.text||'';
          editor.classList.add('open');
          setTimeout(()=>input.focus(),0);
        });

        cancelButton.addEventListener('click',closeEditor);

        saveButton.addEventListener('click',async()=>{
          const text=input.value.trim();
          if(!text){
            status.textContent='Введите текст послания.';
            return;
          }
          saveButton.disabled=true;
          status.textContent='Сохраняю…';
          try{
            const r=await fetch('/api/partner-message',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({text,initData:tg.initData}),
              cache:'no-store'
            });
            const data=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(data.error||'save');
            currentMessage=data.message;
            renderPartnerMessage(currentMessage);
            closeEditor();
            try{tg?.HapticFeedback?.notificationOccurred?.('success')}catch(_){}
          }catch(error){
            status.textContent=String(error?.message||'Ошибка сохранения');
            try{tg?.HapticFeedback?.notificationOccurred?.('error')}catch(_){}
          }finally{
            saveButton.disabled=false;
          }
        });

        loadPartnerMessage().then(message=>{currentMessage=message});
      }

      function setupStreakAndMood(){
        const {key,utc}=todayState();
        const prev=new Date(utc-DAY);
        const prevKey=[prev.getUTCFullYear(),String(prev.getUTCMonth()+1).padStart(2,'0'),String(prev.getUTCDate()).padStart(2,'0')].join('-');
        let streak=1;
        try{
          const last=localStorage.getItem('rudi-last-open');
          const stored=Math.max(1,Number(localStorage.getItem('rudi-open-streak'))||1);
          if(last===key) streak=stored;
          else if(last===prevKey) streak=stored+1;
          localStorage.setItem('rudi-last-open',key);
          localStorage.setItem('rudi-open-streak',String(streak));
        }catch(_){}
        document.getElementById('streakValue').textContent=streak;
        document.getElementById('streakCaption').textContent=streakWord(streak);

        const moodKey='rudi-mood-'+key;
        const buttons=Array.from(document.querySelectorAll('.mood-button'));
        const select=value=>buttons.forEach(button=>{
          const selected=button.dataset.mood===value;
          button.classList.toggle('selected',selected);
          button.setAttribute('aria-pressed',selected?'true':'false');
        });
        try{select(localStorage.getItem(moodKey)||'')}catch(_){select('')}
        buttons.forEach(button=>button.addEventListener('click',()=>{
          try{localStorage.setItem(moodKey,button.dataset.mood)}catch(_){}
          select(button.dataset.mood);
          try{tg?.HapticFeedback?.selectionChanged?.()}catch(_){}
        }));
      }

      async function init(){
        const config=await loadConfig();
        const {utc}=todayState();
        const dayIndex=Math.floor(utc/DAY);

        const type=detectNameType(firstName);
        const compliments=config.compliments||fallback.compliments;
        const surpriseChance=Number(compliments.surpriseChance)||0;
        const useSurprise=(compliments.surprises?.length||0)>0 && secureRandom()<surpriseChance;
        const pool=useSurprise ? compliments.surprises : (compliments[type]||compliments.neutral||fallback.compliments.neutral);
        document.getElementById('compliment').textContent=randomItem(pool);

        const ideas=config.dailyIdeas?.length?config.dailyIdeas:fallback.dailyIdeas;
        const watch=config.watchList?.length?config.watchList:fallback.watchList;
        const cook=config.cookList?.length?config.cookList:fallback.cookList;
        document.getElementById('dailyIdea').textContent=ideas[Math.abs(dayIndex)%ideas.length];
        document.getElementById('watchToday').textContent=watch[Math.abs(dayIndex+3)%watch.length];
        document.getElementById('cookToday').textContent=cook[Math.abs(dayIndex+7)%cook.length];

        renderNearest(config);
        setupPartnerMessage();
        setupStreakAndMood();
        loadWeather(config.weather);
      }

      init();

      window.addEventListener('pageshow',event=>{if(event.persisted) location.reload()});
      let hiddenAt=0;
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
        if(hiddenAt&&Date.now()-hiddenAt>1200) location.reload();
      });
    })();
  </script>
