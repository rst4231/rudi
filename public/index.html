<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>RUDI</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('rudi-theme');
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
      } catch (_) {}
    })();
  </script>
  <style>
    :root{
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      --bg:#f4f5f7;
      --surface:rgba(255,255,255,.72);
      --surface-hover:rgba(255,255,255,.95);
      --text:#15171c;
      --muted:#7b818c;
      --line:rgba(20,24,32,.09);
      --shadow:0 18px 44px rgba(35,42,56,.08);
      --shadow-hover:0 24px 64px rgba(35,42,56,.14);
      --glow-a:rgba(73,103,255,.15);
      --glow-b:rgba(145,89,255,.11);
      --toggle:rgba(255,255,255,.74);
    }
    html[data-theme="dark"]{
      --bg:#0b0d12;
      --surface:rgba(20,23,31,.72);
      --surface-hover:rgba(27,31,41,.95);
      --text:#f5f7fb;
      --muted:#8c94a3;
      --line:rgba(255,255,255,.08);
      --shadow:0 18px 48px rgba(0,0,0,.30);
      --shadow-hover:0 26px 72px rgba(0,0,0,.42);
      --glow-a:rgba(64,96,255,.18);
      --glow-b:rgba(143,70,255,.12);
      --toggle:rgba(20,23,31,.78);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    html{background:var(--bg);transition:background-color .3s ease}
    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      overflow:hidden;
      padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
      color:var(--text);
      background:
        radial-gradient(circle at 15% 18%,var(--glow-a),transparent 36%),
        radial-gradient(circle at 86% 82%,var(--glow-b),transparent 38%),
        var(--bg);
      -webkit-font-smoothing:antialiased;
      transition:background-color .3s ease,color .3s ease;
    }
    body::before,
    body::after{
      content:"";
      position:fixed;
      width:38vw;
      height:38vw;
      min-width:240px;
      min-height:240px;
      max-width:520px;
      max-height:520px;
      border-radius:50%;
      filter:blur(70px);
      opacity:.23;
      pointer-events:none;
      animation:float 14s ease-in-out infinite alternate;
    }
    body::before{left:-14vw;top:-15vw;background:var(--glow-a)}
    body::after{right:-14vw;bottom:-16vw;background:var(--glow-b);animation-delay:-5s}
    .shell{
      position:relative;
      z-index:1;
      width:min(100%,540px);
    }
    .toolbar{
      display:flex;
      justify-content:flex-end;
      margin-bottom:14px;
    }
    .theme-toggle{
      width:44px;
      height:44px;
      display:grid;
      place-items:center;
      padding:0;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--toggle);
      color:var(--text);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      cursor:pointer;
      transition:transform .2s ease,background-color .3s ease,border-color .3s ease,box-shadow .25s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .theme-toggle:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
    .theme-toggle:active{transform:scale(.94)}
    .theme-toggle svg{width:20px;height:20px;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .2s ease}
    .theme-toggle .sun{display:none}
    html[data-theme="light"] .theme-toggle .sun{display:block}
    html[data-theme="light"] .theme-toggle .moon{display:none}
    .links{
      display:grid;
      gap:12px;
    }
    .card{
      position:relative;
      isolation:isolate;
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:18px 20px;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--surface);
      color:var(--text);
      text-decoration:none;
      box-shadow:var(--shadow);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      opacity:0;
      transform:translateY(14px) scale(.985);
      animation:cardIn .55s cubic-bezier(.2,.8,.2,1) forwards;
      transition:transform .24s cubic-bezier(.2,.8,.2,1),background-color .3s ease,border-color .3s ease,box-shadow .3s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .card:nth-child(2){animation-delay:.07s}
    .card:nth-child(3){animation-delay:.14s}
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:linear-gradient(110deg,transparent 15%,rgba(255,255,255,.12) 48%,transparent 78%);
      transform:translateX(-120%);
      transition:transform .65s ease;
    }
    html[data-theme="light"] .card::before{
      background:linear-gradient(110deg,transparent 15%,rgba(255,255,255,.72) 48%,transparent 78%);
    }
    .card:hover{
      transform:translateY(-4px) scale(1.008);
      background:var(--surface-hover);
      box-shadow:var(--shadow-hover);
    }
    .card:hover::before{transform:translateX(120%)}
    .card:active{transform:scale(.985)}
    .label{
      font-size:17px;
      line-height:1.2;
      font-weight:720;
      letter-spacing:-.018em;
    }
    .arrow{
      flex:0 0 auto;
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:11px;
      background:rgba(127,127,127,.10);
      color:var(--text);
      transition:transform .24s ease,background-color .24s ease;
    }
    .arrow svg{width:17px;height:17px}
    .card:hover .arrow{transform:translate(2px,-2px);background:rgba(127,127,127,.16)}
    @keyframes cardIn{
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    @keyframes float{
      from{transform:translate3d(0,0,0) scale(1)}
      to{transform:translate3d(30px,20px,0) scale(1.08)}
    }
    @media(max-width:430px){
      .toolbar{margin-bottom:12px}
      .theme-toggle{width:42px;height:42px;border-radius:13px}
      .links{gap:10px}
      .card{min-height:68px;padding:17px 18px;border-radius:18px}
      .label{font-size:16px}
      .arrow{width:32px;height:32px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
      .card{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="toolbar">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Переключить тему">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z"/>
        </svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.6"/>
          <path d="M12 2.2v2.1M12 19.7v2.1M4.3 4.3l1.5 1.5M18.2 18.2l1.5 1.5M2.2 12h2.1M19.7 12h2.1M4.3 19.7l1.5-1.5M18.2 5.8l1.5-1.5"/>
        </svg>
      </button>
    </div>

    <nav class="links" aria-label="Ссылки">
      <a class="card" href="https://gemini.google.com/share/a09a924c005c" target="_blank" rel="noopener noreferrer">
        <span class="label">Трекер голодания</span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>
      <a class="card" href="https://gemini.google.com/share/41a7861ea171" target="_blank" rel="noopener noreferrer">
        <span class="label">Создать фотосессию</span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>
      <a class="card" href="https://gemini.google.com/share/dc69e53d2e41" target="_blank" rel="noopener noreferrer">
        <span class="label">Рецепты</span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>
    </nav>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      const toggle = document.getElementById('themeToggle');
      const media = window.matchMedia('(prefers-color-scheme: dark)');

      function applyTheme(theme, persist = true) {
        root.dataset.theme = theme;
        metaTheme.setAttribute('content', theme === 'dark' ? '#0b0d12' : '#f4f5f7');
        if (persist) {
          try { localStorage.setItem('rudi-theme', theme); } catch (_) {}
        }
      }

      applyTheme(root.dataset.theme || (media.matches ? 'dark' : 'light'), false);

      toggle.addEventListener('click', () => {
        applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      media.addEventListener?.('change', event => {
        try {
          if (!localStorage.getItem('rudi-theme')) applyTheme(event.matches ? 'dark' : 'light', false);
        } catch (_) {}
      });

      window.addEventListener('pageshow', event => {
        if (event.persisted) location.reload();
      });

      let hiddenAt = 0;
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          hiddenAt = Date.now();
          return;
        }
        if (hiddenAt && Date.now() - hiddenAt > 1200) {
          location.reload();
        }
      });
    })();
  </script>
</body>
</html>
