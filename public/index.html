<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>RUDI</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = tg?.colorScheme || (systemDark ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root{
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      --bg:#f4f5f7;
      --surface:rgba(255,255,255,.74);
      --surface-strong:rgba(255,255,255,.90);
      --surface-hover:rgba(255,255,255,.98);
      --text:#15171c;
      --muted:#7b818c;
      --line:rgba(20,24,32,.09);
      --soft:rgba(25,31,42,.055);
      --shadow:0 18px 44px rgba(35,42,56,.08);
      --shadow-hover:0 24px 64px rgba(35,42,56,.13);
      --glow-a:rgba(73,103,255,.15);
      --glow-b:rgba(145,89,255,.10);
      --avatar-ring:rgba(255,255,255,.74);
      --icon-bg:rgba(67,89,255,.085);
      --icon-stroke:#5266d9;
    }
    html[data-theme="dark"]{
      --bg:#0b0d12;
      --surface:rgba(20,23,31,.73);
      --surface-strong:rgba(24,28,37,.92);
      --surface-hover:rgba(28,32,42,.97);
      --text:#f5f7fb;
      --muted:#8c94a3;
      --line:rgba(255,255,255,.08);
      --soft:rgba(255,255,255,.055);
      --shadow:0 18px 48px rgba(0,0,0,.30);
      --shadow-hover:0 26px 72px rgba(0,0,0,.42);
      --glow-a:rgba(64,96,255,.18);
      --glow-b:rgba(143,70,255,.12);
      --avatar-ring:rgba(255,255,255,.10);
      --icon-bg:rgba(120,137,255,.12);
      --icon-stroke:#aebaff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    html{background:var(--bg);transition:background-color .28s ease}
    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      overflow-x:hidden;
      padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
      color:var(--text);
      background:
        radial-gradient(circle at 12% 10%,var(--glow-a),transparent 34%),
        radial-gradient(circle at 88% 92%,var(--glow-b),transparent 40%),
        var(--bg);
      -webkit-font-smoothing:antialiased;
      transition:background-color .28s ease,color .28s ease;
    }
    body::before,
    body::after{
      content:"";
      position:fixed;
      width:38vw;
      height:38vw;
      min-width:240px;
      min-height:240px;
      max-width:520px;
      max-height:520px;
      border-radius:50%;
      filter:blur(72px);
      opacity:.22;
      pointer-events:none;
      animation:float 14s ease-in-out infinite alternate;
    }
    body::before{left:-14vw;top:-15vw;background:var(--glow-a)}
    body::after{right:-14vw;bottom:-16vw;background:var(--glow-b);animation-delay:-5s}
    .shell{
      position:relative;
      z-index:1;
      width:min(100%,540px);
      display:grid;
      gap:16px;
    }
    .profile{
      position:relative;
      overflow:hidden;
      padding:22px;
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--surface);
      box-shadow:var(--shadow);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      animation:heroIn .58s cubic-bezier(.2,.8,.2,1) both;
    }
    .profile::after{
      content:"";
      position:absolute;
      width:150px;
      height:150px;
      right:-56px;
      top:-70px;
      border-radius:50%;
      background:var(--glow-a);
      filter:blur(28px);
      opacity:.35;
      pointer-events:none;
    }
    .identity{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
    }
    .avatar{
      position:relative;
      flex:0 0 auto;
      width:68px;
      height:68px;
      display:grid;
      place-items:center;
      overflow:hidden;
      border:3px solid var(--avatar-ring);
      border-radius:22px;
      background:linear-gradient(145deg,rgba(91,112,255,.30),rgba(145,89,255,.24)),var(--surface-strong);
      box-shadow:0 12px 26px rgba(0,0,0,.12);
      color:var(--text);
      font-size:20px;
      font-weight:780;
      letter-spacing:-.03em;
      user-select:none;
    }
    .avatar img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0;
      transition:opacity .25s ease;
    }
    .avatar.has-photo img{opacity:1}
    .person{
      min-width:0;
      display:grid;
      gap:4px;
    }
    .name{
      overflow:hidden;
      color:var(--text);
      font-size:21px;
      line-height:1.14;
      font-weight:780;
      letter-spacing:-.03em;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .username{
      overflow:hidden;
      color:var(--muted);
      font-size:14px;
      line-height:1.3;
      font-weight:560;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .date-row{
      position:relative;
      z-index:1;
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:16px;
      margin-top:20px;
      padding-top:17px;
      border-top:1px solid var(--line);
    }
    .weekday{
      color:var(--text);
      font-size:15px;
      font-weight:700;
      letter-spacing:-.015em;
      text-transform:capitalize;
    }
    .date{
      color:var(--muted);
      font-size:14px;
      font-weight:560;
      text-align:right;
    }
    .compliment{
      position:relative;
      z-index:1;
      margin-top:17px;
      padding:14px 15px;
      border:1px solid var(--line);
      border-radius:16px;
      background:linear-gradient(135deg,var(--soft),transparent),var(--surface-strong);
      color:var(--text);
      font-size:14px;
      line-height:1.45;
      font-weight:620;
      letter-spacing:-.01em;
      box-shadow:0 10px 26px rgba(0,0,0,.055);
      animation:complimentIn .52s .12s cubic-bezier(.2,.8,.2,1) both;
    }
    .birthdays{
      position:relative;
      z-index:1;
      display:grid;
      gap:9px;
      margin-top:17px;
      padding-top:17px;
      border-top:1px solid var(--line);
    }
    .birthday-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:14px;
      padding:12px 13px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--soft);
    }
    .birthday-person{
      min-width:0;
      display:grid;
      gap:3px;
    }
    .birthday-name{
      color:var(--text);
      font-size:14px;
      line-height:1.2;
      font-weight:700;
      letter-spacing:-.012em;
    }
    .birthday-date{
      color:var(--muted);
      font-size:12.5px;
      line-height:1.25;
      font-weight:540;
    }
    .birthday-left{
      min-width:78px;
      padding:8px 10px;
      border-radius:12px;
      background:var(--surface-strong);
      color:var(--text);
      font-size:12.5px;
      line-height:1.15;
      font-weight:720;
      text-align:center;
      white-space:nowrap;
      box-shadow:0 7px 18px rgba(0,0,0,.055);
    }
    .links{
      display:grid;
      gap:11px;
    }
    .card{
      position:relative;
      isolation:isolate;
      min-height:76px;
      display:grid;
      grid-template-columns:44px minmax(0,1fr) 34px;
      align-items:center;
      gap:14px;
      padding:15px 18px 15px 15px;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:21px;
      background:var(--surface);
      color:var(--text);
      text-decoration:none;
      box-shadow:var(--shadow);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      opacity:0;
      transform:translateY(14px) scale(.985);
      animation:cardIn .55s cubic-bezier(.2,.8,.2,1) forwards;
      transition:transform .24s cubic-bezier(.2,.8,.2,1),background-color .28s ease,border-color .28s ease,box-shadow .28s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .card:nth-child(1){animation-delay:.08s}
    .card:nth-child(2){animation-delay:.15s}
    .card:nth-child(3){animation-delay:.22s}
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:linear-gradient(110deg,transparent 15%,rgba(255,255,255,.12) 48%,transparent 78%);
      transform:translateX(-120%);
      transition:transform .65s ease;
    }
    html[data-theme="light"] .card::before{
      background:linear-gradient(110deg,transparent 15%,rgba(255,255,255,.70) 48%,transparent 78%);
    }
    .card:hover{
      transform:translateY(-4px) scale(1.008);
      background:var(--surface-hover);
      box-shadow:var(--shadow-hover);
    }
    .card:hover::before{transform:translateX(120%)}
    .card:active{transform:scale(.985)}
    .feature-icon{
      width:44px;
      height:44px;
      display:grid;
      place-items:center;
      border-radius:15px;
      background:var(--icon-bg);
      color:var(--icon-stroke);
      transition:transform .28s cubic-bezier(.2,.8,.2,1),background-color .28s ease;
    }
    .feature-icon svg{
      width:24px;
      height:24px;
      overflow:visible;
    }
    .card:hover .feature-icon{transform:scale(1.07) rotate(-2deg)}
    .label{
      min-width:0;
      overflow:hidden;
      color:var(--text);
      font-size:16px;
      line-height:1.25;
      font-weight:720;
      letter-spacing:-.018em;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .arrow{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:11px;
      background:var(--soft);
      color:var(--text);
      transition:transform .24s ease,background-color .24s ease;
    }
    .arrow svg{width:17px;height:17px}
    .card:hover .arrow{transform:translate(2px,-2px);background:rgba(127,127,127,.14)}
    @keyframes heroIn{
      from{opacity:0;transform:translateY(-10px) scale(.985)}
      to{opacity:1;transform:none}
    }
    @keyframes complimentIn{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:none}
    }
    @keyframes cardIn{
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    @keyframes float{
      from{transform:translate3d(0,0,0) scale(1)}
      to{transform:translate3d(30px,20px,0) scale(1.08)}
    }
    @media(max-width:430px){
      body{padding-left:14px;padding-right:14px}
      .shell{gap:13px}
      .profile{padding:19px;border-radius:23px}
      .avatar{width:62px;height:62px;border-radius:20px}
      .name{font-size:19px}
      .date-row{margin-top:18px;padding-top:15px}
      .card{
        min-height:72px;
        grid-template-columns:42px minmax(0,1fr) 32px;
        gap:12px;
        padding:14px 15px 14px 14px;
        border-radius:19px;
      }
      .feature-icon{width:42px;height:42px;border-radius:14px}
      .feature-icon svg{width:23px;height:23px}
      .label{font-size:15.5px}
      .arrow{width:32px;height:32px}
    }
    @media(max-width:350px){
      .date-row{align-items:flex-start;flex-direction:column;gap:5px}
      .date{text-align:left}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
      .card{opacity:1;transform:none}
    }
  </style>
</head>

  <script>
    (() => {
      const root = document.documentElement;
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const tg = window.Telegram?.WebApp;

      const applyTheme = () => {
        const theme = tg?.colorScheme || (media.matches ? 'dark' : 'light');
        root.dataset.theme = theme;
        metaTheme.setAttribute('content', theme === 'dark' ? '#0b0d12' : '#f4f5f7');
        try {
          tg?.setHeaderColor?.(theme === 'dark' ? '#0b0d12' : '#f4f5f7');
          tg?.setBackgroundColor?.(theme === 'dark' ? '#0b0d12' : '#f4f5f7');
          tg?.setBottomBarColor?.(theme === 'dark' ? '#0b0d12' : '#f4f5f7');
        } catch (_) {}
      };

      applyTheme();
      tg?.ready?.();
      tg?.expand?.();
      tg?.onEvent?.('themeChanged', applyTheme);
      media.addEventListener?.('change', () => {
        if (!tg?.initData) applyTheme();
      });

      const user = tg?.initDataUnsafe?.user;
      const displayName = document.getElementById('displayName');
      const username = document.getElementById('username');
      const avatar = document.getElementById('avatar');
      const avatarImage = document.getElementById('avatarImage');
      const initials = document.getElementById('initials');

      let firstNameForCompliment = '';

      if (user) {
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ').trim() || 'Пользователь';
        firstNameForCompliment = (user.first_name || '').trim();
        displayName.textContent = fullName;

        if (user.username) {
          username.textContent = '@' + user.username;
          username.hidden = false;
        } else {
          username.textContent = 'Telegram';
        }

        const parts = [user.first_name, user.last_name].filter(Boolean);
        initials.textContent = (parts.length ? parts.map(part => part.charAt(0)).join('') : 'T').slice(0,2).toUpperCase();

        if (user.photo_url) {
          avatarImage.src = user.photo_url;
          avatarImage.alt = 'Фото профиля ' + fullName;
          avatarImage.addEventListener('load', () => avatar.classList.add('has-photo'), { once:true });
          avatarImage.addEventListener('error', () => avatar.classList.remove('has-photo'), { once:true });
        }
      }

      const maleCompliments = [
        'Сегодня ты выглядишь особенно уверенно.',
        'У тебя отличный настрой — это чувствуется.',
        'Ты производишь впечатление человека, который знает, чего хочет.',
        'Тебе идёт эта собранность и спокойствие.',
        'Сегодня определённо твой день.',
        'У тебя сильная энергия — хороший старт дня.',
        'Выглядишь как человек, у которого всё под контролем.',
        'Твоя уверенность сегодня особенно заметна.'
      ];

      const femaleCompliments = [
        'Сегодня ты особенно прекрасно выглядишь.',
        'У тебя очень приятная энергия сегодня.',
        'Тебе невероятно идёт это настроение.',
        'Сегодня ты буквально излучаешь уверенность.',
        'Ты умеешь делать день красивее одним своим появлением.',
        'Сегодня определённо твой день.',
        'У тебя очень тёплая и притягательная энергия.',
        'Ты сегодня особенно прекрасна.'
      ];

      const neutralCompliments = [
        'Сегодня отличный день, чтобы сделать что-то приятное для себя.',
        'Ты сегодня в отличной форме.',
        'У тебя сегодня особенно хорошая энергия.',
        'Пусть сегодняшний день приятно удивит.',
        'Сегодня отличный день для хороших решений.',
        'У тебя всё получится — настроение уже правильное.',
        'Сегодняшний день тебе определённо идёт.',
        'Хороший день начинается с хорошего настроя.'
      ];

      function detectNameType(name) {
        const value = String(name || '').trim().toLowerCase();
        if (!value) return 'neutral';

        const maleNames = new Set([
          'александр','алексей','андрей','антон','артем','артём','вадим','валерий','виктор','владимир','владислав',
          'дмитрий','евгений','егор','иван','илья','кирилл','константин','максим','михаил','никита','николай',
          'олег','павел','роман','руслан','рустам','сергей','станислав','тимур','федор','фёдор','юрий'
        ]);
        const femaleNames = new Set([
          'александра','алёна','алена','алина','алиса','анастасия','анна','валерия','виктория','дарья','диана',
          'екатерина','елена','ирина','карина','кристина','ксения','марина','мария','наталья','ольга','полина',
          'светлана','софия','софья','татьяна','юлия'
        ]);

        if (maleNames.has(value)) return 'male';
        if (femaleNames.has(value)) return 'female';

        if (/[ая]$/.test(value) && !/(никита|илья|кузьма|фома|лука)$/.test(value)) return 'female';
        if (/(й|н|р|м|л|в|г|д|т|с|б|п|к|ч|ш|ж|ф)$/.test(value)) return 'male';
        return 'neutral';
      }

      function pickRandom(list) {
        if (window.crypto?.getRandomValues) {
          const value = new Uint32Array(1);
          window.crypto.getRandomValues(value);
          return list[value[0] % list.length];
        }
        return list[Math.floor(Math.random() * list.length)];
      }

      const complimentType = detectNameType(firstNameForCompliment);
      const complimentPool = complimentType === 'male'
        ? maleCompliments
        : complimentType === 'female'
          ? femaleCompliments
          : neutralCompliments;
      document.getElementById('compliment').textContent = pickRandom(complimentPool);

      const now = new Date();
      const weekdayText = new Intl.DateTimeFormat('ru-RU', {
        weekday:'long',
        timeZone:'Europe/Moscow'
      }).format(now);
      const dateText = new Intl.DateTimeFormat('ru-RU', {
        day:'numeric',
        month:'long',
        year:'numeric',
        timeZone:'Europe/Moscow'
      }).format(now);

      document.getElementById('weekday').textContent = weekdayText;
      document.getElementById('date').textContent = dateText;

      const moscowParts = Object.fromEntries(
        new Intl.DateTimeFormat('en-CA', {
          timeZone:'Europe/Moscow',
          year:'numeric',
          month:'numeric',
          day:'numeric'
        }).formatToParts(now)
          .filter(part => part.type !== 'literal')
          .map(part => [part.type, Number(part.value)])
      );

      const todayUtc = Date.UTC(moscowParts.year, moscowParts.month - 1, moscowParts.day);
      const DAY = 86400000;

      function daysUntilBirthday(month, day) {
        let target = Date.UTC(moscowParts.year, month - 1, day);
        if (target < todayUtc) target = Date.UTC(moscowParts.year + 1, month - 1, day);
        return Math.round((target - todayUtc) / DAY);
      }

      function dayWord(value) {
        const mod10 = value % 10;
        const mod100 = value % 100;
        if (mod10 === 1 && mod100 !== 11) return 'день';
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'дня';
        return 'дней';
      }

      function birthdayLabel(days) {
        return days === 0 ? 'сегодня' : days + ' ' + dayWord(days);
      }

      document.getElementById('rustamBirthday').textContent = birthdayLabel(daysUntilBirthday(3, 3));
      document.getElementById('dianaBirthday').textContent = birthdayLabel(daysUntilBirthday(6, 30));

      window.addEventListener('pageshow', event => {
        if (event.persisted) location.reload();
      });

      let hiddenAt = 0;
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          hiddenAt = Date.now();
          return;
        }
        if (hiddenAt && Date.now() - hiddenAt > 1200) location.reload();
      });
    })();
  </script>
</body>
</html>
