<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="color-scheme" content="dark">
  <title>RUDI</title>
  <style>
    :root{
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      color:#f7f8fb;
      background:#0b0e14;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0e14;color:#f7f8fb}
    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
      -webkit-font-smoothing:antialiased;
    }
    main{
      width:min(100%,520px);
      display:grid;
      gap:14px;
    }
    .button{
      width:100%;
      min-height:64px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 20px;
      border:1px solid #2a3342;
      border-radius:18px;
      background:#171c26;
      color:#f7f8fb;
      text-decoration:none;
      text-align:center;
      font-size:17px;
      font-weight:750;
      line-height:1.25;
      letter-spacing:-.01em;
      box-shadow:0 12px 30px rgba(0,0,0,.18);
      transition:transform .16s ease,background .16s ease,border-color .16s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .button:hover{background:#1c2330;border-color:#364357}
    .button:active{transform:scale(.985)}
    @media(max-width:430px){
      main{gap:12px}
      .button{min-height:60px;border-radius:16px;font-size:16px}
    }
  </style>
</head>
<body>
  <main aria-label="Ссылки">
    <a class="button" href="https://gemini.google.com/share/a09a924c005c" target="_blank" rel="noopener noreferrer">✅ Трекер голодания</a>
    <a class="button" href="https://gemini.google.com/share/41a7861ea171" target="_blank" rel="noopener noreferrer">✅ Создать фотосессию</a>
    <a class="button" href="https://gemini.google.com/share/dc69e53d2e41" target="_blank" rel="noopener noreferrer">Рецепты</a>
  </main>
</body>
</html>
