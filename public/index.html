<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="color-scheme" content="dark">
  <title>RUDI — Настройки бота</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#f7f8fb;background:#0b0e14;--bg:#0b0e14;--panel:#141821;--panel2:#191e29;--line:#252c39;--muted:#8993a5;--text:#f7f8fb;--accent:#5aa7ff;--green:#65d995;--red:#ff7885;--radius:16px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text)}body{overflow:hidden;-webkit-font-smoothing:antialiased}.app-shell{width:min(100%,760px);height:100dvh;min-height:100dvh;margin:0 auto;padding:max(11px,env(safe-area-inset-top)) 12px max(11px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:9px;overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:850;font-size:15px;letter-spacing:-.04em;background:linear-gradient(145deg,#6db5ff,#387fe8);box-shadow:0 8px 24px rgba(60,132,235,.26)}.brand-copy{min-width:0}.brand-title{font-weight:800;font-size:18px;line-height:1.05;letter-spacing:-.02em}.brand-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;align-items:center;gap:6px}.status{height:32px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:11px;font-weight:750;color:var(--muted);white-space:nowrap}.status .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(137,147,165,.09)}.status.ok{color:var(--green)}.status.bad{color:var(--red)}.icon-btn{width:32px;height:32px;padding:0;border:1px solid var(--line);background:var(--panel);color:#dce3ee;border-radius:11px;display:grid;place-items:center;text-decoration:none;cursor:pointer;font:700 15px/1 inherit;transition:.16s ease}.icon-btn:active{transform:scale(.94);background:var(--panel2)}.icon-btn:disabled{opacity:.45}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.metric{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 10px}.metric-label{display:block;color:var(--muted);font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric-value{display:block;margin-top:4px;font-size:13px;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dashboard{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:9px}.utility-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.card-title{font-size:13px;font-weight:820;letter-spacing:-.01em}.card-note{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.compact-list{display:grid;gap:6px}.compact-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.compact-label{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.compact-value{font-size:10px;font-weight:750;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66%}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:21px;padding:0 8px;border-radius:999px;border:1px solid #344052;font-size:9px;font-weight:820;color:#aab4c4}.pill.on{border-color:rgba(101,217,149,.32);background:rgba(101,217,149,.08);color:var(--green)}.pill.off{border-color:rgba(255,120,133,.3);background:rgba(255,120,133,.07);color:var(--red)}.sections-card{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.sections-card .card-head{margin-bottom:9px}.sections{min-height:0;height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px}.section{min-width:0;min-height:0;background:linear-gradient(145deg,#1b2130,#171c27);border:1px solid #283243;border-radius:13px;padding:11px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}.section-top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}.section-main{display:flex;align-items:center;gap:9px;min-width:0}.section-icon{flex:0 0 auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#202838;border:1px solid #2c374a;font-size:16px}.section-name{min-width:0;font-size:11px;font-weight:800;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.section-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:9px}.section-meta span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section-state{font-weight:760;color:#6f7b90}.error{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;max-width:736px;margin:auto;padding:10px 12px;border:1px solid rgba(255,120,133,.35);border-radius:12px;color:#ffc1c7;background:#351b22;box-shadow:0 16px 50px rgba(0,0,0,.35);font-size:11px}.hidden{display:none!important}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}@media(max-width:430px){.app-shell{padding-left:10px;padding-right:10px;gap:8px}.topbar{min-height:45px}.logo{width:36px;height:36px;border-radius:12px}.brand-title{font-size:17px}.brand-sub{font-size:10px}.status{height:30px;padding:0 8px}.status span:last-child{max-width:80px;overflow:hidden;text-overflow:ellipsis}.icon-btn{width:30px;height:30px}.summary{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,auto);gap:6px}.metric{padding:9px 10px}.metric-label{font-size:9px}.metric-value{font-size:13px}.dashboard{gap:8px}.utility-grid{gap:7px}.card{padding:10px}.card-head{margin-bottom:7px}.sections{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.section{padding:10px}.section-icon{width:30px;height:30px;font-size:15px}.section-name{font-size:11px}}@media(max-height:720px){.brand-sub{display:none}.app-shell{gap:6px}.summary{gap:5px}.metric{padding-top:7px;padding-bottom:7px}.card{padding-top:8px;padding-bottom:8px}.card-head{margin-bottom:5px}.compact-list{gap:3px}.section{padding:8px;gap:6px}.section-icon{width:26px;height:26px;font-size:13px}.section-meta{font-size:8px}}@media(min-width:540px){.summary{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto}.sections{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}}@media(min-width:700px){.app-shell{padding-left:16px;padding-right:16px}.sections{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body data-density="compact">
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">RU</div>
        <div class="brand-copy"><div class="brand-title">RUDI</div><div class="brand-sub">Настройки бота · SPB Daily Guide</div></div>
      </div>
      <div class="top-actions">
        <span id="status" class="status"><span class="dot"></span><span>Загрузка</span></span>
        <button id="refresh" class="icon-btn" type="button" aria-label="Обновить">↻</button>
        <a class="icon-btn" href="/admin" aria-label="Админка">⋯</a>
      </div>
    </header>

    <section class="summary" aria-label="Сводка">
      <div class="metric"><span class="metric-label">Дата · Москва</span><b id="date" class="metric-value">—</b></div>
      <div class="metric"><span class="metric-label">Конфигурация</span><b id="settingsSource" class="metric-value">—</b></div>
      <div class="metric"><span class="metric-label">Рубрики</span><b id="enabledCount" class="metric-value">—</b></div>
      <div class="metric"><span class="metric-label">Последний запуск</span><b id="lastRun" class="metric-value">—</b></div>
    </section>

    <section class="dashboard">
      <div class="utility-grid">
        <article class="card">
          <div class="card-head"><div class="card-title">Расписание</div><div id="cronMini" class="card-note">—</div></div>
          <div id="publishing" class="compact-list"></div>
        </article>
        <article class="card">
          <div class="card-head"><div class="card-title">Алерты</div><div id="alertMini" class="card-note">—</div></div>
          <div id="alerts" class="compact-list"></div>
        </article>
      </div>

      <article class="card sections-card">
        <div class="card-head"><div class="card-title">Рубрики и темы</div><div id="sectionMini" class="card-note">—</div></div>
        <div id="sections" class="sections"></div>
      </article>
    </section>
  </main>
  <div id="error" class="error hidden"></div>
<script>
(() => {
  const sectionLabels={events:'Места и мероприятия',holidays:'Праздники',facts:'Факты',clients:'Советы клиентам',cinema:'Кинопремьеры',labor:'Труд'};
  const sectionIcons={events:'📍',holidays:'🎉',facts:'💡',clients:'💬',cinema:'🎬',labor:'⚖️'};
  const $=(id)=>document.getElementById(id);
  const esc=(value)=>String(value??'').replace(/[&<>"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const compactRow=(label,value,extra='')=>`<div class="compact-row"><span class="compact-label">${esc(label)}</span><span class="compact-value ${extra}">${esc(value)}</span></div>`;
  const bool=(value)=>`<span class="pill ${value?'on':'off'}">${value?'вкл':'выкл'}</span>`;
  function render(data){
    const status=$('status');status.className=`status ${data?.ok?'ok':'bad'}`;status.innerHTML=`<span class="dot"></span><span>${data?.ok?'Работает':'Проблема'}</span>`;
    $('date').textContent=data?.date||'—';
    $('settingsSource').textContent=`v${data?.settingsVersion??'—'} · ${data?.settingsSource||'—'}`;
    const sections=data?.sections||{};const entries=Object.entries(sections);const enabled=entries.filter(([,v])=>v?.enabled!==false).length;
    $('enabledCount').textContent=`${enabled}/${entries.length||0}`;
    $('sectionMini').textContent=`${enabled} активных`;
    $('lastRun').textContent=data?.lastDailyRun?.date||'нет';
    const publishing=data?.operationalSettings?.publishing||{};
    $('cronMini').textContent=data?.cron?.schedule||'—';
    $('publishing').innerHTML=[compactRow('Запуск',data?.cron?.description||'—'),compactRow('Часовой пояс',data?.timezone||'—'),`<div class="compact-row"><span class="compact-label">Автоповтор</span><span class="compact-value">${bool(Boolean(publishing.allowAutomaticRetry))}</span></div>`].join('');
    $('sections').innerHTML=entries.map(([name,value])=>{const isOn=value?.enabled!==false;const topic=Number.isInteger(value?.topicId)?`topic ${value.topicId}`:'динамический topic';return `<div class="section"><div class="section-top"><div class="section-main"><div class="section-icon" aria-hidden="true">${sectionIcons[name]||'•'}</div><div class="section-name">${esc(sectionLabels[name]||name)}</div></div><span class="pill ${isOn?'on':'off'}">${isOn?'вкл':'выкл'}</span></div><div class="section-meta"><span>${esc(topic)}</span><span class="section-state">${isOn?'активна':'пауза'}</span></div></div>`}).join('')||'<span class="card-note">Нет данных</span>';
    const alerts=data?.operationalSettings?.alerts||{};const active=data?.alerts?.message||data?.alerts?.code||'';
    $('alertMini').textContent=active?'есть активный':'спокойно';
    $('alerts').innerHTML=[`<div class="compact-row"><span class="compact-label">Уведомления</span><span class="compact-value">${bool(Boolean(alerts.enabled))}</span></div>`,compactRow('Повтор',`${alerts.dedupeMinutes??'—'} мин`),compactRow('Сейчас',active||'нет')].join('');
    $('error').classList.add('hidden');
  }
  async function load(){
    $('refresh').disabled=true;
    try{const response=await fetch('/api/health',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);render(await response.json())}
    catch(error){const box=$('error');box.textContent=`Не удалось загрузить настройки: ${error.message}`;box.classList.remove('hidden');const status=$('status');status.className='status bad';status.innerHTML='<span class="dot"></span><span>Нет данных</span>'}
    finally{$('refresh').disabled=false}
  }
  $('refresh').addEventListener('click',load);load();
})();
</script>
</body>
</html>
